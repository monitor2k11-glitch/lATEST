<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineage// Data Lineage & ER Diagram Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B0D12;
  --panel:#12151C;
  --panel-2:#171B24;
  --line:#242938;
  --line-soft:#1B2029;
  --text:#E7E9EE;
  --text-dim:#8A90A2;
  --text-faint:#565C6E;
  --accent:#3FE0C5;
  --accent-dim:#1F5C51;
  --pk:#F2B94D;
  --pk-dim:#4A3A18;
  --fk:#6E9CFF;
  --fk-dim:#1E2C4E;
  --danger:#FF6B6B;
  --mono:'IBM Plex Mono', monospace;
  --sans:'Inter', sans-serif;
  --radius:6px;
}
body.theme-light{
  --bg:#F3F4F7;
  --panel:#FFFFFF;
  --panel-2:#F1F2F6;
  --line:#DDE1E9;
  --line-soft:#E9ECF2;
  --text:#181B22;
  --text-dim:#5B6272;
  --text-faint:#8B92A3;
  --accent:#0D9488;
  --accent-dim:#CFF3EC;
  --pk:#A5690A;
  --pk-dim:#FBE7C2;
  --fk:#2A57D6;
  --fk-dim:#E1E8FF;
  --danger:#D6455A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;transition:background .2s,color .2s;}
::selection{background:var(--accent-dim);color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
input,select{font-family:var(--sans);}

/* ===== App shell ===== */
#app{display:flex;flex-direction:column;height:100vh;}

/* ---- Header ---- */
header{
  display:flex;align-items:center;gap:16px;
  padding:0 18px;height:56px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--line);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:600;letter-spacing:.2px;white-space:nowrap;}
.brand .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.brand small{color:var(--text-faint);font-weight:400;font-size:11px;margin-left:2px;}

.selector-group{display:flex;align-items:center;gap:8px;}
.selector-group label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);}
#objectSelect{
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  padding:8px 12px;border-radius:var(--radius);font-size:13px;min-width:260px;
  outline:none;
}
#objectSelect:focus{border-color:var(--accent);}

.type-badge{
  font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:4px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;
}
.type-badge.TABLE{background:#132A26;color:var(--accent);}
.type-badge.VIEW{background:#241E3D;color:#B79CFF;}
.type-badge.PROCEDURE{background:#2E2113;color:#FFB25C;}

.search-group{position:relative;display:flex;align-items:center;}
.search-icon{position:absolute;left:10px;width:14px;height:14px;color:var(--text-faint);pointer-events:none;}
#columnSearch{
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  padding:8px 12px 8px 32px;border-radius:var(--radius);font-size:13px;width:220px;
  outline:none;font-family:var(--mono);
}
#columnSearch:focus{border-color:var(--accent);}
#columnSearchResults{
  display:none;position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:360px;overflow-y:auto;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.4);
  z-index:50;
}
#columnSearchResults.show{display:block;}
.search-result{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;font-size:12.5px;font-family:var(--mono);cursor:pointer;border-bottom:1px solid var(--line-soft);
}
.search-result:last-child{border-bottom:none;}
.search-result:hover{background:var(--panel);}
.search-result .sr-col{color:var(--text);font-weight:600;}
.search-result .sr-table{color:var(--text-faint);font-size:11px;}
.search-empty{padding:12px;font-size:12px;color:var(--text-faint);font-style:italic;}

header .spacer{flex:1;}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:500;
  transition:all .15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn.primary{background:var(--accent);color:#04231D;border-color:var(--accent);}
.icon-btn.primary:hover{filter:brightness(1.08);color:#04231D;}
.icon-btn svg{width:14px;height:14px;flex:none;}

/* ---- Tabs ---- */
.tabs{
  display:flex;gap:2px;padding:0 18px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;height:42px;
}
.tab{
  background:transparent;border:none;color:var(--text-faint);
  padding:0 16px;font-size:12.5px;font-weight:600;letter-spacing:.02em;
  border-bottom:2px solid transparent;font-family:var(--mono);
  display:flex;align-items:center;
}
.tab:hover{color:var(--text-dim);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ---- Main area ---- */
main{flex:1;display:flex;overflow:hidden;position:relative;}
.view{display:none;flex:1;overflow:hidden;}
.view.active{display:flex;}

/* ===== Diagram tab ===== */
#diagramCanvasWrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1px) 0 0/22px 22px, var(--bg);
  cursor:grab;
}
#diagramCanvasWrap.grabbing{cursor:grabbing;}
#svgCanvas{position:absolute;top:0;left:0;}
.node-drag-handle{cursor:grab;}
.node-drag-handle:active{cursor:grabbing;}
.er-node.dragging{filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));}
.canvas-toolbar{
  position:absolute;bottom:16px;left:16px;display:flex;gap:6px;z-index:10;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;
}
.canvas-toolbar button{
  width:30px;height:30px;background:transparent;border:none;color:var(--text-dim);
  border-radius:6px;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.canvas-toolbar button:hover{background:var(--panel-2);color:var(--accent);}
.canvas-legend{
  position:absolute;top:16px;left:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:11px;color:var(--text-dim);z-index:10;
  display:flex;flex-direction:column;gap:6px;font-family:var(--mono);
}
.canvas-legend .row{display:flex;align-items:center;gap:7px;}
.swatch{width:9px;height:9px;border-radius:2px;flex:none;}

/* Sidebar */
#sidebar{
  width:360px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:18px;
}
#sidebar h2{font-size:15px;margin:0 0 2px;font-family:var(--mono);}
#sidebar .subhead{font-size:11px;color:var(--text-faint);margin-bottom:18px;text-transform:uppercase;letter-spacing:.06em;}
.side-section{margin-bottom:22px;}
.side-section h3{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);
  margin:0 0 10px;font-family:var(--mono);display:flex;align-items:center;gap:6px;
}
.dep-card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;
}
.dep-card .dep-title{display:flex;align-items:center;justify-content:between;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px;}
.dep-card .dep-cols{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);line-height:1.6;}
.dep-card .dep-cols code{color:var(--accent);background:none;}
.empty-note{color:var(--text-faint);font-size:12px;font-style:italic;padding:8px 0;}
.chip{
  display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;
  margin-left:6px;
}
.chip.TABLE{background:#132A26;color:var(--accent);}
.chip.VIEW{background:#241E3D;color:#B79CFF;}
.chip.PROCEDURE{background:#2E2113;color:#FFB25C;}

/* ===== Lineage flow tab ===== */
#lineageView{flex-direction:column;overflow-y:auto;padding:28px 40px;gap:18px;}
.flow-header{margin-bottom:6px;}
.flow-header h2{font-family:var(--mono);font-size:18px;margin:0 0 4px;}
.flow-header p{color:var(--text-dim);font-size:13px;margin:0;max-width:760px;line-height:1.5;}
.flow-chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:20px 0 30px;}
.flow-node{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 16px;min-width:150px;font-family:var(--mono);font-size:12.5px;
}
.flow-node .t{color:var(--text-faint);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.flow-node .n{font-weight:600;color:var(--text);}
.flow-arrow{display:flex;align-items:center;color:var(--text-faint);padding:0 10px;font-size:16px;}
.transform-table{width:100%;border-collapse:collapse;font-size:13px;}
.transform-table th{
  text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-faint);padding:8px 12px;border-bottom:1px solid var(--line);
}
.transform-table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;vertical-align:top;}
.transform-table tr:hover td{background:var(--panel-2);}
.src-col{color:var(--accent);}
.tgt-col{color:var(--fk);}
.op-badge{
  display:inline-block;background:#241E3D;color:#B79CFF;padding:2px 8px;border-radius:10px;
  font-size:11px;font-family:var(--mono);
}
.stmt-badge{
  display:inline-block;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;
}
.stmt-badge.UPDATE{background:#2E2113;color:#FFB25C;}
.stmt-badge.INSERT{background:#132A26;color:var(--accent);}
.stmt-badge.SELECT{background:#1B2440;color:var(--fk);}
.stmt-badge.DELETE{background:#3A1A1A;color:var(--danger);}
.section-block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:20px;}
.section-block h3{margin:0 0 14px;font-size:13px;font-family:var(--mono);color:var(--text-dim);display:flex;align-items:center;gap:8px;}

/* ===== JSON tab ===== */
#jsonView{flex-direction:column;padding:0;}
.json-toolbar{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex:none;}
#jsonOutput{
  flex:1;overflow:auto;margin:0;padding:20px 28px;font-family:var(--mono);font-size:12.5px;
  line-height:1.6;color:#B9C4D4;white-space:pre;
}
.jk{color:#6E9CFF;} .jstr{color:#8FE3B7;} .jnum{color:#F2B94D;} .jbool{color:#FF9E9E;}

/* ===== Settings tab ===== */
#settingsView{padding:32px 40px;overflow-y:auto;flex-direction:column;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:800px;}
.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;}
.settings-card h3{margin:0 0 14px;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);}
.field-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.field-row:last-child{border-bottom:none;}
.field-row select,.field-row input[type=number]{
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:12px;
}
.toggle{position:relative;width:36px;height:20px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;flex:none;}
.toggle.on{background:var(--accent-dim);border-color:var(--accent);}
.toggle .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-faint);transition:.15s;}
.toggle.on .knob{left:18px;background:var(--accent);}
.settings-actions{max-width:800px;display:flex;gap:10px;margin-top:22px;}
#importFile{display:none;}
.settings-note{color:var(--text-faint);font-size:12px;max-width:800px;margin-top:14px;line-height:1.6;}

/* drag-and-drop SQL upload overlay */
#dropOverlay{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(11,13,18,.82);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;
}
body.theme-light #dropOverlay{background:rgba(244,245,247,.88);}
#dropOverlay.active{display:flex;}
.drop-card{
  border:2px dashed var(--accent);border-radius:16px;padding:44px 56px;
  text-align:center;color:var(--text);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:none;
}
.drop-card svg{color:var(--accent);}
.drop-title{font-family:var(--mono);font-size:16px;font-weight:600;}
.drop-sub{font-size:12.5px;color:var(--text-dim);max-width:320px;}

#statusToast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 18px;font-size:12.5px;font-family:var(--mono);color:var(--text);
  z-index:210;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:70vw;
}
#statusToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#statusToast.error{border-color:var(--danger);color:var(--danger);}

/* tooltip */
#tooltip{
  position:fixed;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:8px 11px;font-size:11.5px;font-family:var(--mono);color:var(--text);pointer-events:none;
  z-index:100;display:none;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#tooltip .tt-label{color:var(--text-faint);font-size:10px;text-transform:uppercase;margin-bottom:3px;}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#242938;border-radius:5px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:#333a4d;}

@media(max-width:900px){
  #sidebar{position:absolute;right:0;top:0;bottom:0;transform:translateX(0);box-shadow:-10px 0 30px rgba(0,0,0,.5);}
}
</style>
</head>
<body>
<div id="app">

  <div id="dropOverlay">
    <div class="drop-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
      <div class="drop-title">Drop .sql file(s) to load</div>
      <div class="drop-sub">Parses CREATE TABLE / VIEW / PROCEDURE statements from every file dropped</div>
    </div>
  </div>
  <div id="statusToast"></div>

  <header>
    <div class="brand"><span class="dot"></span>LINEAGE// <small>ER &amp; Data Lineage Viewer</small></div>
    <div class="selector-group">
      <label>Object</label>
      <select id="objectSelect"></select>
      <span id="objectTypeBadge" class="type-badge"></span>
    </div>
    <div class="search-group">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="columnSearch" placeholder="Search columns…" autocomplete="off">
      <div id="columnSearchResults"></div>
    </div>
    <div class="spacer"></div>
    <div class="header-actions">
      <button class="icon-btn" id="btnOverallDiagram" title="Show the full schema ER diagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Overall Diagram
      </button>
      <button class="icon-btn" id="btnLoadSql" title="Upload one or more .sql files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        Load SQL
      </button>
      <input type="file" id="sqlFileInput" accept=".sql,.txt" multiple style="display:none;">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Light
      </button>
      <button class="icon-btn" id="btnExportExcel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M3 9h18M3 15h18"/></svg>
        Export Excel
      </button>
      <button class="icon-btn" id="btnExport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        Export HD PNG
      </button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="diagramView">◎ ER Diagram</button>
    <button class="tab" data-view="lineageView">→ Lineage Flow</button>
    <button class="tab" data-view="jsonView">{ } Parsed JSON</button>
    <button class="tab" data-view="settingsView">⚙ Settings</button>
  </div>

  <main>
    <!-- ER Diagram -->
    <div class="view active" id="diagramView">
      <div id="diagramCanvasWrap">
        <div class="canvas-legend">
          <div class="row"><span class="swatch" style="background:var(--pk)"></span> Primary Key</div>
          <div class="row"><span class="swatch" style="background:var(--fk)"></span> Foreign Key</div>
          <div class="row"><span class="swatch" style="background:var(--text-faint)"></span> * Not Null</div>
          <div class="row"><span class="swatch" style="background:var(--accent)"></span> Selected / Highlighted path</div>
          <div class="row" style="margin-top:2px;border-top:1px solid var(--line);padding-top:6px;">⠿ Drag a table's title bar to reposition it</div>
        </div>
        <svg id="svgCanvas" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="canvas-toolbar">
          <button id="zoomIn" title="Zoom in">+</button>
          <button id="zoomOut" title="Zoom out">−</button>
          <button id="zoomReset" title="Reset pan/zoom">⤾</button>
          <button id="layoutReset" title="Reset moved tables to default layout">⌂</button>
        </div>
      </div>
      <div id="sidebar"></div>
    </div>

    <!-- Lineage Flow -->
    <div class="view" id="lineageView"></div>

    <!-- JSON -->
    <div class="view" id="jsonView">
      <div class="json-toolbar">
        <button class="icon-btn" id="btnCopyJson">Copy JSON</button>
      </div>
      <pre id="jsonOutput"></pre>
    </div>

    <!-- Settings -->
    <div class="view" id="settingsView"></div>
  </main>
</div>

<div id="tooltip"></div>

<script>
/* =========================================================================
   1. SAMPLE SQL SOURCE  (used as input to the parser below)
   ========================================================================= */
const SAMPLE_SQL = `
CREATE TABLE Customers (
  CustomerID INT PRIMARY KEY,
  FirstName VARCHAR(50) NOT NULL,
  LastName VARCHAR(50) NOT NULL,
  Email VARCHAR(100) NOT NULL UNIQUE,
  Phone VARCHAR(20),
  CreatedAt DATETIME NOT NULL
);

CREATE TABLE Orders (
  OrderID INT PRIMARY KEY,
  CustomerID INT NOT NULL REFERENCES Customers(CustomerID),
  CustomerName VARCHAR(100),
  OrderDate DATETIME NOT NULL,
  TotalAmount DECIMAL(10,2) NOT NULL,
  Status VARCHAR(20) NOT NULL
);

CREATE TABLE OrderItems (
  OrderItemID INT PRIMARY KEY,
  OrderID INT NOT NULL REFERENCES Orders(OrderID),
  ProductName VARCHAR(100) NOT NULL,
  Quantity INT NOT NULL,
  UnitPrice DECIMAL(10,2) NOT NULL
);

CREATE VIEW CustomerOrderSummary AS
SELECT c.CustomerID, UPPER(c.FirstName) AS FirstName, c.Email,
       COUNT(o.OrderID) AS TotalOrders, SUM(o.TotalAmount) AS LifetimeValue
FROM Customers c
JOIN Orders o ON c.CustomerID = o.CustomerID
GROUP BY c.CustomerID, c.FirstName, c.Email;

CREATE PROCEDURE UpdateCustomerEmail
  @CustomerID INT,
  @NewEmail VARCHAR(100)
AS
BEGIN
  UPDATE Customers
  SET Email = LOWER(@NewEmail)
  WHERE CustomerID = @CustomerID;
END;

CREATE PROCEDURE CreateOrderFromCustomer
  @CustomerID INT,
  @TotalAmount DECIMAL(10,2)
AS
BEGIN
  INSERT INTO Orders (CustomerID, CustomerName, OrderDate, TotalAmount, Status)
  SELECT c.CustomerID, CONCAT(c.FirstName, ' ', c.LastName), GETDATE(), @TotalAmount, 'Pending'
  FROM Customers c
  WHERE c.CustomerID = @CustomerID;
END;
`;

/* =========================================================================
   2. SQL PARSER
      Lightweight regex/tokenizer-based parser (not a full ANSI grammar).
      It is deliberately readable so it can be swapped for a real parser
      (e.g. `node-sql-parser`) later — the OUTPUT SHAPE is what the rest
      of the app depends on.
   ========================================================================= */
const Parser = (() => {

  // Normalize common real-world T-SQL/MySQL dump quirks so the regex-based
  // parsing below doesn't have to special-case them everywhere:
  //  - strip block and line comments
  //  - treat a lone "GO" batch separator line as a statement terminator
  //  - strip [bracket]/`backtick` identifier quoting (SSMS / MySQL exports)
  function preprocess(rawSql){
    let s = rawSql;
    s = s.replace(/\/\*[\s\S]*?\*\//g, ' ');           // block comments
    s = s.replace(/--[^\n\r]*/g, '');                   // line comments
    s = s.replace(/^[ \t]*DELIMITER\s+\S+[ \t]*$/gim, ''); // MySQL client DELIMITER directive (not real SQL)
    s = s.replace(/^[ \t]*GO[ \t]*$/gim, ';');          // GO batch separator -> ';'
    s = s.replace(/^[ \t]*\/[ \t]*$/gm, ';');           // Oracle SQL*Plus '/' batch terminator -> ';'
    s = s.replace(/\[([^\[\]]+)\]/g, '$1');             // [Identifier] -> Identifier
    s = s.replace(/`([^`]+)`/g, '$1');                  // `identifier` -> identifier
    s = s.replace(/"([^"]+)"/g, '$1');                  // "identifier" -> identifier (ANSI quoting)
    return s;
  }

  // split a string on a delimiter, but only at paren-depth 0
  function splitTopLevel(str, delim=','){
    const parts=[]; let depth=0, cur='';
    for(const ch of str){
      if(ch==='(') depth++;
      if(ch===')') depth--;
      if(ch===delim && depth===0){ parts.push(cur); cur=''; }
      else cur+=ch;
    }
    if(cur.trim()) parts.push(cur);
    return parts.map(s=>s.trim()).filter(Boolean);
  }

  // find the index of the ')' that matches the '(' at openIdx, respecting nesting
  function findMatchingParen(str, openIdx){
    let depth = 0;
    for(let i=openIdx; i<str.length; i++){
      if(str[i]==='(') depth++;
      else if(str[i]===')'){ depth--; if(depth===0) return i; }
    }
    return -1;
  }

  // find the next top-level (depth<=0 relative to fromIndex) occurrence of `ch`
  function findTopLevelChar(str, ch, fromIndex){
    let depth = 0;
    for(let i=fromIndex; i<str.length; i++){
      const c = str[i];
      if(c==='(') depth++;
      else if(c===')') depth--;
      else if(c===ch && depth<=0) return i;
    }
    return -1;
  }

  function parseColumnDef(line){
    // table-level named/unnamed FOREIGN KEY (...) REFERENCES ...(...)
    let m = line.match(/^(?:CONSTRAINT\s+\w+\s+)?FOREIGN KEY\s*\(\s*(\w+)\s*\)\s*REFERENCES\s+(?:\w+\.)*(\w+)\s*\(\s*(\w+)\s*\)/i);
    if(m){ return {pendingFK:{column:m[1], refTable:m[2], refColumn:m[3]}}; }
    // table-level named/unnamed PRIMARY KEY (...)
    m = line.match(/^(?:CONSTRAINT\s+\w+\s+)?PRIMARY KEY\s*(?:CLUSTERED|NONCLUSTERED)?\s*\(([^)]+)\)/i);
    if(m){ return {tablePK: m[1].split(',').map(s=>s.trim().split(/\s+/)[0])}; }
    // table-level UNIQUE (...) — record but don't need to act on it individually
    m = line.match(/^(?:CONSTRAINT\s+\w+\s+)?UNIQUE\s*(?:CLUSTERED|NONCLUSTERED)?\s*\(([^)]+)\)/i);
    if(m){ return {tableUnique: m[1].split(',').map(s=>s.trim().split(/\s+/)[0])}; }
    // table-level CHECK(...) — not modeled, ignore safely
    if(/^(?:CONSTRAINT\s+\w+\s+)?CHECK\s*\(/i.test(line)) return null;
    // MySQL-style index declarations inside CREATE TABLE — not columns
    if(/^(?:UNIQUE\s+|FULLTEXT\s+|SPATIAL\s+)?(?:KEY|INDEX)\s+/i.test(line)) return null;

    // regular column: Name TYPE(args)? constraints...
    m = line.match(/^(\w+)\s+([A-Za-z][\w]*(?:\([^)]*\))?)([\s\S]*)$/);
    if(!m) return null;
    const [, name, type, rest] = m;
    const col = {
      name, type: type.toUpperCase(), isPK:false, isFK:false, notNull:false, unique:false,
      references:null
    };
    if(/PRIMARY KEY/i.test(rest)) col.isPK = true;
    if(/NOT NULL/i.test(rest)) col.notNull = true;
    if(/\bUNIQUE\b/i.test(rest)) col.unique = true;
    const refMatch = rest.match(/REFERENCES\s+(?:\w+\.)*(\w+)\s*\(\s*(\w+)\s*\)/i);
    if(refMatch){ col.isFK = true; col.references = {table:refMatch[1], column:refMatch[2]}; }
    return {col};
  }

  function parseTables(sql){
    const tables = {};
    const re = /CREATE TABLE\s+(?:IF NOT EXISTS\s+)?(?:\w+\.)*(\w+)\s*\(/gi;
    let m;
    while((m = re.exec(sql))){
      const tableName = m[1];
      const openIdx = re.lastIndex - 1; // '(' is the last character matched
      const closeIdx = findMatchingParen(sql, openIdx);
      if(closeIdx === -1) continue;
      const body = sql.slice(openIdx+1, closeIdx);
      re.lastIndex = closeIdx + 1;

      try{
        const columns = []; const pendingFKs = [];
        let tablePK = null;
        for(const line of splitTopLevel(body)){
          const parsed = parseColumnDef(line);
          if(!parsed) continue;
          if(parsed.tablePK) tablePK = parsed.tablePK;
          if(parsed.pendingFK) pendingFKs.push(parsed.pendingFK);
          if(parsed.col) columns.push(parsed.col);
        }
        // apply table-level PK
        if(tablePK) columns.forEach(c=>{ if(tablePK.includes(c.name)) c.isPK = true; });
        // apply table-level FKs collected separately
        pendingFKs.forEach(fk=>{
          const c = columns.find(c=>c.name===fk.column);
          if(c){ c.isFK = true; c.references = {table:fk.refTable, column:fk.refColumn}; }
        });
        tables[tableName] = { name: tableName, type:'TABLE', columns };
      }catch(err){ /* skip this table, keep parsing the rest of the file */ }
    }
    return tables;
  }

  // Many real-world scripts (esp. SSMS-generated ones) add foreign keys via a
  // separate ALTER TABLE ... ADD CONSTRAINT ... FOREIGN KEY statement rather
  // than inline in CREATE TABLE. Catch those here as well.
  function parseAlterForeignKeys(sql, tables){
    const re = /ALTER TABLE\s+(?:\w+\.)*(\w+)\s+(?:WITH\s+\w+\s+)?ADD\s+(?:CONSTRAINT\s+\w+\s+)?FOREIGN KEY\s*\(\s*(\w+)\s*\)\s*REFERENCES\s+(?:\w+\.)*(\w+)\s*\(\s*(\w+)\s*\)/gi;
    let m;
    while((m = re.exec(sql))){
      const [, tableName, col, refTable, refCol] = m;
      const t = tables[tableName];
      if(!t) continue;
      const c = t.columns.find(c=>c.name===col);
      if(c){ c.isFK = true; c.references = {table:refTable, column:refCol}; }
      else {
        // FK on a column ALTER TABLE also declares — model it even if the
        // column wasn't found verbatim (defensive, rare)
      }
    }
  }

  function parseSelectColumns(selectClause){
    // returns [{expr, alias, sourceRef, func}]
    return splitTopLevel(selectClause).map(item=>{
      let alias=null, expr=item;
      const asMatch = item.match(/^(.*)\sAS\s+(\w+)$/i);
      if(asMatch){ expr = asMatch[1].trim(); alias = asMatch[2]; }
      const funcMatch = expr.match(/^(\w+)\s*\((.*)\)$/s);
      let func=null, inner=expr;
      if(funcMatch){ func = funcMatch[1].toUpperCase(); inner = funcMatch[2]; }
      // grab first column-like ref inside (alias.col or col)
      const refMatch = inner.match(/(\w+)\.(\w+)/) || inner.match(/^(\w+)$/);
      let sourceRef = null;
      if(refMatch){
        sourceRef = refMatch[2] ? {tableAlias:refMatch[1], column:refMatch[2]} : {tableAlias:null, column:refMatch[1]};
      }
      return {expr, alias, func, sourceRef, raw:item};
    });
  }

  function parseFromJoins(clause){
    // returns {aliasMap:{alias:table}, joins:[{table,alias,on}]}
    const IDENT = '[#@]?(?:\\w+\\.)*\\w+';
    const aliasMap = {};
    const joins = [];
    const fromMatch = clause.match(new RegExp(`FROM\\s+(${IDENT})(?:\\s+(?:AS\\s+)?(\\w+))?`, 'i'));
    if(fromMatch){
      const table = fromMatch[1].split('.').pop();
      aliasMap[fromMatch[2]||table] = table;
    }
    const joinRe = new RegExp(`(?:INNER|LEFT|RIGHT|FULL)?\\s*(?:OUTER)?\\s*JOIN\\s+(${IDENT})(?:\\s+(?:AS\\s+)?(\\w+))?\\s+ON\\s+([\\s\\S]*?)(?=(?:INNER|LEFT|RIGHT|FULL)?\\s*(?:OUTER)?\\s*JOIN\\s|WHERE\\b|GROUP BY\\b|ORDER BY\\b|HAVING\\b|$)`, 'gi');
    let jm;
    while((jm = joinRe.exec(clause))){
      const [, tableRaw, alias, on] = jm;
      const table = tableRaw.split('.').pop();
      aliasMap[alias||table] = table;
      joins.push({table, alias: alias||table, on: on.trim().replace(/[\s;]+$/,'')});
    }
    return {aliasMap, joins};
  }

  function parseViews(sql){
    const views = {};
    const re = /CREATE\s+(?:OR REPLACE\s+)?(?:OR ALTER\s+)?(?:ALGORITHM\s*=\s*\S+\s+)?(?:DEFINER\s*=\s*\S+\s+)?(?:SQL SECURITY\s+(?:DEFINER|INVOKER)\s+)?VIEW\s+(?:\w+\.)*(\w+)\s+AS\b/gi;
    let m;
    while((m = re.exec(sql))){
      try{
        const viewName = m[1];
        const afterAsIdx = re.lastIndex;
        const bodyEnd = findStatementEnd(sql, afterAsIdx);
        const body = sql.slice(afterAsIdx, bodyEnd);
        re.lastIndex = bodyEnd;

        const selectMatch = body.match(/SELECT\s+([\s\S]*?)\s+FROM\s+([\s\S]*)/i);
        const columns = [];
        let sourceTables = [];
        let joins = [];
        if(selectMatch){
          const selectCols = parseSelectColumns(selectMatch[1]);
          const {aliasMap, joins:jns} = parseFromJoins('FROM ' + selectMatch[2]);
          joins = jns;
          sourceTables = [...new Set(Object.values(aliasMap))];
          selectCols.forEach(sc=>{
            const srcTable = sc.sourceRef && sc.sourceRef.tableAlias ? aliasMap[sc.sourceRef.tableAlias] : sourceTables[0];
            columns.push({
              name: sc.alias || (sc.sourceRef ? sc.sourceRef.column : sc.raw),
              sourceTable: srcTable || null,
              sourceColumn: sc.sourceRef ? sc.sourceRef.column : null,
              transformation: sc.func || (sc.alias ? 'RENAME' : 'DIRECT')
            });
          });
        }
        views[viewName] = {
          name: viewName, type:'VIEW',
          columns: columns.map(c=>({name:c.name, type:'DERIVED', isPK:false, isFK:false, notNull:false})),
          baseTables: sourceTables,
          joins,
          transformations: columns
        };
      }catch(err){
        // one malformed view shouldn't prevent the rest of the file from parsing
        if(re.lastIndex <= m.index) re.lastIndex = m.index + m[0].length;
      }
    }
    return views;
  }

  // Locate the end of a CREATE VIEW/PROCEDURE body starting at `fromIndex`:
  // prefer the next top-level ';', else the next top-level CREATE/ALTER
  // statement, else end of string.
  function findStatementEnd(sql, fromIndex){
    const semiIdx = findTopLevelChar(sql, ';', fromIndex);
    const nextStmtMatch = /\bCREATE\s+(?:OR ALTER\s+)?(?:TABLE|VIEW|PROC|PROCEDURE)\b|\bALTER TABLE\b/i.exec(sql.slice(fromIndex));
    const nextStmtIdx = nextStmtMatch ? fromIndex + nextStmtMatch.index : -1;
    const candidates = [semiIdx, nextStmtIdx].filter(i=> i !== -1 && i > fromIndex);
    return candidates.length ? Math.min(...candidates) : sql.length;
  }

  // Find the END that matches the BEGIN starting at beginIdx, correctly
  // handling nested BEGIN/END from IF blocks, WHILE loops, TRY/CATCH, and
  // CASE...END expressions (which also close with a bare END). MySQL's
  // "BEGIN TRANSACTION" and its compound closers ("END IF", "END WHILE",
  // "END LOOP", "END CASE", "END REPEAT") don't pair with a real BEGIN/CASE,
  // so those are ignored rather than counted.
  function findMatchingEnd(sql, beginIdx){
    const re = /\bBEGIN\b(\s+TRAN(?:SACTION)?\b)?|\bCASE\b|\bEND\b(\s+(?:IF|WHILE|LOOP|CASE|REPEAT)\b)?/gi;
    re.lastIndex = beginIdx;
    let depth = 0, m;
    while((m = re.exec(sql))){
      const word = m[0];
      const isBeginTran = !!m[1];
      const isEndCompound = !!m[2];
      if(isBeginTran || isEndCompound) continue;
      if(/^BEGIN\b/i.test(word)) depth++;
      else if(/^CASE\b/i.test(word)) depth++;
      else { depth--; if(depth===0) return {start:m.index, end:re.lastIndex}; }
    }
    return null;
  }

  // find the first top-level (not inside parens) occurrence of a DML keyword —
  // used to strip leftover IF/BEGIN/END/ELSE control-flow noise that a naive
  // semicolon split leaves stuck to the front of the next real statement
  function findTopLevelKeyword(str){
    const re = /\b(SELECT|INSERT|UPDATE|DELETE|MERGE)\b/gi;
    let depth = 0, lastIndex = 0, m;
    while((m = re.exec(str))){
      for(let i=lastIndex; i<m.index; i++){
        if(str[i]==='(') depth++;
        else if(str[i]===')') depth--;
      }
      lastIndex = m.index;
      if(depth<=0) return m.index;
    }
    return -1;
  }

  // true if `keyword` appears at paren-depth 0 in str — used so a FROM/JOIN
  // buried inside a subquery (e.g. "WHERE id IN (SELECT x FROM y)") doesn't
  // get mistaken for a top-level clause
  function hasTopLevelKeyword(str, keyword){
    const re = new RegExp('\\b'+keyword+'\\b', 'gi');
    let depth = 0, lastIndex = 0, m;
    while((m = re.exec(str))){
      for(let i=lastIndex; i<m.index; i++){
        if(str[i]==='(') depth++;
        else if(str[i]===')') depth--;
      }
      lastIndex = m.index;
      if(depth<=0) return true;
    }
    return false;
  }

  function parseProcedures(sql){
    const procs = {};
    const IDENT = '[#@]?(?:\\w+\\.)*\\w+';
    // header: CREATE [OR REPLACE|OR ALTER] [DEFINER=x] PROCEDURE|PROC|FUNCTION name
    const headerRe = /CREATE\s+(?:OR REPLACE\s+)?(?:OR ALTER\s+)?(?:DEFINER\s*=\s*\S+\s+)?(?:PROCEDURE|PROC|FUNCTION)\s+(?:\w+\.)*(\w+)\s*/gi;
    let m;
    while((m = headerRe.exec(sql))){
      try{
        const name = m[1];
        let cursor = headerRe.lastIndex;

        // optional parameter list in parens: (param1 TYPE, param2 TYPE, ...)
        let paramBlock = '';
        cursor += /^\s*/.exec(sql.slice(cursor))[0].length;
        if(sql[cursor] === '('){
          const closeIdx = findMatchingParen(sql, cursor);
          if(closeIdx !== -1){ paramBlock = sql.slice(cursor+1, closeIdx); cursor = closeIdx + 1; }
        }

        // bound the search window so we never read past the next CREATE TABLE/VIEW/PROC statement
        const nextStmtMatch = /\bCREATE\s+(?:OR REPLACE\s+)?(?:OR ALTER\s+)?(?:TABLE|VIEW|PROC|PROCEDURE|FUNCTION)\b|\bALTER TABLE\b/i.exec(sql.slice(cursor));
        const windowEnd = nextStmtMatch ? cursor + nextStmtMatch.index : sql.length;

        let body, bodyEndIdx;

        // Postgres/MySQL dollar-quoted body: ... AS $$ ... $$ [LANGUAGE ...];
        const dollarMatch = /\bAS\s+(\$\w*\$)/i.exec(sql.slice(cursor, windowEnd));
        if(dollarMatch){
          const tag = dollarMatch[1];
          const tagContentStart = cursor + dollarMatch.index + dollarMatch[0].length;
          const closeTagIdx = sql.indexOf(tag, tagContentStart);
          if(closeTagIdx !== -1){
            const inner = sql.slice(tagContentStart, closeTagIdx);
            const beginInInner = /\bBEGIN\b/i.exec(inner);
            body = beginInInner ? inner.slice(beginInInner.index+5).replace(/\bEND\s*;?\s*$/i, '') : inner;
            bodyEndIdx = closeTagIdx + tag.length;
          }
        }

        // Standard BEGIN...END block (T-SQL/MySQL/Oracle), with or without a
        // preceding AS/IS keyword — search the bounded window for the first BEGIN
        if(body === undefined){
          const beginSearch = /\bBEGIN\b(?!\s+TRAN)/i.exec(sql.slice(cursor, windowEnd));
          if(beginSearch){
            const beginIdx = cursor + beginSearch.index;
            const matched = findMatchingEnd(sql, beginIdx);
            if(matched){ body = sql.slice(beginIdx+5, matched.start); bodyEndIdx = matched.end; }
          }
        }

        // No BEGIN/END and no dollar-quoting found: single-statement body,
        // optionally introduced by AS/IS, up to the next statement boundary
        if(body === undefined){
          const asIsMatch = /^\s*(?:AS|IS)\b/i.exec(sql.slice(cursor));
          const bodyStart = asIsMatch ? cursor + asIsMatch[0].length : cursor;
          bodyEndIdx = findStatementEnd(sql, bodyStart);
          body = sql.slice(bodyStart, bodyEndIdx);
        }

        headerRe.lastIndex = bodyEndIdx;

        const params = [];
        let trimmedParamBlock = paramBlock.trim();
        if(trimmedParamBlock.startsWith('(') && trimmedParamBlock.endsWith(')')){
          trimmedParamBlock = trimmedParamBlock.slice(1, -1).trim();
        }
        splitTopLevel(trimmedParamBlock).forEach(p=>{
          // T-SQL style: @name TYPE
          let pm = p.match(/@(\w+)\s+([\w()0-9,]+)/);
          // MySQL/Postgres/Oracle style: [IN|OUT|INOUT] name TYPE
          if(!pm) pm = p.match(/^(?:IN|OUT|INOUT)?\s*(\w+)\s+([\w()0-9,]+)/i);
          if(pm) params.push({name:pm[1], type:pm[2].toUpperCase()});
        });

        const statements = splitTopLevel(body, ';').map(s=>s.trim()).filter(Boolean);
        const transformations = [];
        const tablesTouched = new Set();
        const statementSummaries = [];

        statements.forEach(stmtRaw=>{
          // strip leftover IF/BEGIN/END/ELSE control-flow noise by jumping to
          // the first top-level DML keyword in this fragment
          const kwIdx = findTopLevelKeyword(stmtRaw);
          const stmt = kwIdx === -1 ? '' : stmtRaw.slice(kwIdx).trim();
          if(!stmt) return;

          if(/^UPDATE\b/i.test(stmt)){
            const setIdx = stmt.search(/\bSET\b/i);
            const preSetClause = setIdx !== -1 ? stmt.slice(0, setIdx) : stmt;
            const afterSetClause = setIdx !== -1 ? stmt.slice(setIdx) : '';
            const hasFrom = hasTopLevelKeyword(afterSetClause, 'FROM');
            const hasJoinBeforeSet = hasTopLevelKeyword(preSetClause, 'JOIN');

            // Pattern 1: UPDATE alias SET ... FROM table alias [JOIN ...] [WHERE ...]  (SQL Server / Postgres UPDATE...FROM)
            const umFrom = hasFrom ? stmt.match(new RegExp(`UPDATE\\s+(${IDENT})(?:\\s+(?:AS\\s+)?(\\w+))?\\s+SET\\s+([\\s\\S]*?)\\s+FROM\\s+([\\s\\S]*)`, 'i')) : null;
            if(umFrom){
              const [, targetIdent, targetAliasWord, setClause, fromClause] = umFrom;
              const whereSplit = fromClause.match(/^([\s\S]*?)\s+WHERE\s+([\s\S]*)$/i);
              const joinSource = whereSplit ? whereSplit[1] : fromClause;
              const whereClause = whereSplit ? whereSplit[2] : null;
              const {aliasMap} = parseFromJoins('FROM ' + joinSource);
              const targetToken = targetAliasWord || targetIdent;
              // prefer resolving through the FROM/JOIN alias map (T-SQL style: UPDATE o SET ... FROM Orders o);
              // fall back to treating the identifier itself as the table (Postgres style: UPDATE orders o SET ... FROM customers c)
              const targetTable = aliasMap[targetToken] || targetIdent.split('.').pop();
              tablesTouched.add(targetTable);
              Object.values(aliasMap).forEach(t=>tablesTouched.add(t));
              splitTopLevel(setClause).forEach(assign=>{
                const am = assign.match(/^(?:\w+\.)?(\w+)\s*=\s*([\s\S]+)$/);
                if(am){
                  const [, col, valueExpr] = am;
                  const refMatch = valueExpr.match(/(\w+)\.(\w+)/);
                  const funcMatch = valueExpr.match(/^(\w+)\s*\(/);
                  transformations.push({
                    type:'UPDATE',
                    sourceTable: refMatch ? (aliasMap[refMatch[1]]||refMatch[1]) : null,
                    sourceColumn: refMatch ? refMatch[2] : valueExpr.trim(),
                    transformation: funcMatch ? funcMatch[1].toUpperCase() : (refMatch ? 'DIRECT' : 'ASSIGN'),
                    targetTable, targetColumn: col,
                    condition: whereClause ? whereClause.trim() : null
                  });
                }
              });
              statementSummaries.push({kind:'UPDATE', table:targetTable, sourceTables:Object.values(aliasMap),
                detail:`SET ${setClause.trim()} FROM ${joinSource.trim()}${whereClause?' WHERE '+whereClause.trim():''}`});
            } else if(hasJoinBeforeSet && setIdx !== -1){
              // Pattern 2 (MySQL): UPDATE table1 [alias1] JOIN table2 [alias2] ON ... SET ... [WHERE ...]  (no FROM)
              const umJoin = stmt.match(/UPDATE\s+([\s\S]*?)\s+SET\s+([\s\S]*?)(?:\s+WHERE\s+([\s\S]*))?$/i);
              if(umJoin){
                const [, targetClause, setClause, whereClause] = umJoin;
                const {aliasMap} = parseFromJoins('FROM ' + targetClause);
                const primaryTable = Object.values(aliasMap)[0] || null;
                Object.values(aliasMap).forEach(t=>tablesTouched.add(t));
                splitTopLevel(setClause).forEach(assign=>{
                  const am = assign.match(/^(?:(\w+)\.)?(\w+)\s*=\s*([\s\S]+)$/);
                  if(am){
                    const [, lhsAlias, col, valueExpr] = am;
                    const targetTable = lhsAlias ? (aliasMap[lhsAlias]||lhsAlias) : primaryTable;
                    const refMatch = valueExpr.match(/(\w+)\.(\w+)/);
                    const funcMatch = valueExpr.match(/^(\w+)\s*\(/);
                    transformations.push({
                      type:'UPDATE',
                      sourceTable: refMatch ? (aliasMap[refMatch[1]]||refMatch[1]) : null,
                      sourceColumn: refMatch ? refMatch[2] : valueExpr.trim(),
                      transformation: funcMatch ? funcMatch[1].toUpperCase() : (refMatch ? 'DIRECT' : 'ASSIGN'),
                      targetTable, targetColumn: col,
                      condition: whereClause ? whereClause.trim() : null
                    });
                  }
                });
                statementSummaries.push({kind:'UPDATE', table:primaryTable, sourceTables:Object.values(aliasMap),
                  detail:`${targetClause.trim()} SET ${setClause.trim()}${whereClause?' WHERE '+whereClause.trim():''}`});
              }
            } else {
              // Pattern 3: UPDATE table [alias] SET col=expr[,...] [WHERE ...]
              const um = stmt.match(new RegExp(`UPDATE\\s+(${IDENT})(?:\\s+(?:AS\\s+)?\\w+)?\\s+SET\\s+([\\s\\S]*?)(?:\\s+WHERE\\s+([\\s\\S]*))?$`, 'i'));
              if(um){
                const [, tableRaw, setClause, whereClause] = um;
                const table = tableRaw.split('.').pop();
                tablesTouched.add(table);
                splitTopLevel(setClause).forEach(assign=>{
                  const am = assign.match(/^(?:\w+\.)?(\w+)\s*=\s*([\s\S]+)$/);
                  if(am){
                    const [, col, valueExpr] = am;
                    const funcMatch = valueExpr.match(/^(\w+)\s*\(/);
                    transformations.push({
                      type:'UPDATE', sourceTable:null, sourceColumn: valueExpr.replace(/^\w+\(|\)$/g,'').trim(),
                      transformation: funcMatch ? funcMatch[1].toUpperCase() : 'ASSIGN',
                      targetTable: table, targetColumn: col,
                      condition: whereClause ? whereClause.trim() : null
                    });
                  }
                });
                statementSummaries.push({kind:'UPDATE', table, detail:`SET ${setClause.trim()}${whereClause?' WHERE '+whereClause.trim():''}`});
              }
            }
          } else if(/^INSERT\b/i.test(stmt)){
            const im = stmt.match(new RegExp(`INSERT\\s+INTO\\s+(${IDENT})\\s*(?:\\(([^)]+)\\))?\\s+SELECT\\s+([\\s\\S]*?)\\s+FROM\\s+([\\s\\S]*)`, 'i'));
            if(im){
              const [, targetTableRaw, colListRaw, selectList, fromClause] = im;
              const targetTable = targetTableRaw.split('.').pop();
              tablesTouched.add(targetTable);
              const targetCols = colListRaw ? colListRaw.split(',').map(s=>s.trim()) : [];
              const selectItems = splitTopLevel(selectList);
              const whereSplit = fromClause.match(/^([\s\S]*?)\s+WHERE\s+([\s\S]*)$/i);
              const joinSource = whereSplit ? whereSplit[1] : fromClause;
              const whereClause = whereSplit ? whereSplit[2] : null;
              const {aliasMap} = parseFromJoins('FROM ' + joinSource);
              const sourceTablesForStmt = [...new Set(Object.values(aliasMap))];
              sourceTablesForStmt.forEach(t=>tablesTouched.add(t));
              selectItems.forEach((item, idx)=>{
                const targetCol = targetCols[idx] || `col${idx}`;
                const funcMatch = item.match(/^(\w+)\s*\((.*)\)$/s);
                const refMatch = item.match(/(\w+)\.(\w+)/);
                transformations.push({
                  type:'INSERT',
                  sourceTable: refMatch ? (aliasMap[refMatch[1]]||refMatch[1]) : null,
                  sourceColumn: refMatch ? refMatch[2] : (funcMatch ? (funcMatch[2].trim() || '(no args)') : item.trim()),
                  transformation: funcMatch ? funcMatch[1].toUpperCase() : (refMatch ? 'DIRECT' : 'LITERAL'),
                  targetTable, targetColumn: targetCol,
                  condition: whereClause ? whereClause.trim() : null
                });
              });
              statementSummaries.push({kind:'INSERT', table:targetTable, sourceTables:sourceTablesForStmt,
                detail:`INTO ${targetTable}${colListRaw?' ('+colListRaw.trim()+')':''} SELECT ... FROM ${joinSource.trim()}`});
            } else {
              const ivm = stmt.match(new RegExp(`INSERT\\s+INTO\\s+(${IDENT})\\s*(?:\\(([^)]+)\\))?\\s+VALUES\\s*\\(([\\s\\S]*)\\)\\s*$`, 'i'));
              if(ivm){
                const [, targetTableRaw, colListRaw, valuesRaw] = ivm;
                const targetTable = targetTableRaw.split('.').pop();
                tablesTouched.add(targetTable);
                const targetCols = colListRaw ? colListRaw.split(',').map(s=>s.trim()) : [];
                splitTopLevel(valuesRaw).forEach((val, idx)=>{
                  const targetCol = targetCols[idx] || `col${idx}`;
                  transformations.push({
                    type:'INSERT', sourceTable:null, sourceColumn: val.trim(),
                    transformation:'LITERAL', targetTable, targetColumn: targetCol, condition:null
                  });
                });
                statementSummaries.push({kind:'INSERT', table:targetTable, sourceTables:[],
                  detail:`INTO ${targetTable}${colListRaw?' ('+colListRaw.trim()+')':''} VALUES (${valuesRaw.trim()})`});
              }
            }
          } else if(/^DELETE\b/i.test(stmt)){
            const dm = stmt.match(new RegExp(`DELETE\\s+FROM\\s+(${IDENT})(?:\\s+WHERE\\s+([\\s\\S]*))?$`, 'i'));
            if(dm){
              const table = dm[1].split('.').pop();
              tablesTouched.add(table);
              statementSummaries.push({kind:'DELETE', table, detail: dm[2] ? `WHERE ${dm[2].trim()}` : '(all rows)'});
            }
          } else if(/^MERGE\b/i.test(stmt)){
            const target = stmt.match(new RegExp(`MERGE\\s+(?:INTO\\s+)?(${IDENT})`, 'i'));
            const using = stmt.match(new RegExp(`USING\\s+(${IDENT})`, 'i'));
            const targetTable = target ? target[1].split('.').pop() : null;
            const usingTable = using ? using[1].split('.').pop() : null;
            if(targetTable) tablesTouched.add(targetTable);
            if(usingTable) tablesTouched.add(usingTable);
            statementSummaries.push({kind:'MERGE', table: targetTable||'(unknown)', sourceTables: usingTable?[usingTable]:[],
              detail: `MERGE ${targetTable||''} USING ${usingTable||'?'} ...`});
          } else if(/^SELECT\b/i.test(stmt)){
            // standalone SELECT (e.g. a reporting proc) — captured as read-only lineage
            const sm = stmt.match(/SELECT\s+([\s\S]*?)\s+FROM\s+([\s\S]*)/i);
            if(sm){
              const [, selectList, fromClauseFull] = sm;
              const whereSplit = fromClauseFull.match(/^([\s\S]*?)\s+WHERE\s+([\s\S]*)$/i);
              const joinSource = whereSplit ? whereSplit[1] : fromClauseFull;
              const whereClause = whereSplit ? whereSplit[2] : null;
              const selectItems = splitTopLevel(selectList);
              const {aliasMap} = parseFromJoins('FROM ' + joinSource);
              const sourceTablesForStmt = [...new Set(Object.values(aliasMap))];
              sourceTablesForStmt.forEach(t=>tablesTouched.add(t));
              selectItems.forEach(item=>{
                const aliasM = item.match(/\sAS\s+(\w+)\s*$/i);
                const funcMatch = item.match(/^(\w+)\s*\((.*)\)$/s);
                const refMatch = item.match(/(\w+)\.(\w+)/);
                const outCol = aliasM ? aliasM[1] : (refMatch ? refMatch[2] : item.trim());
                transformations.push({
                  type:'SELECT',
                  sourceTable: refMatch ? (aliasMap[refMatch[1]]||refMatch[1]) : (sourceTablesForStmt[0]||null),
                  sourceColumn: refMatch ? refMatch[2] : (funcMatch ? (funcMatch[2].trim()||'(no args)') : item.trim()),
                  transformation: funcMatch ? funcMatch[1].toUpperCase() : 'DIRECT',
                  targetTable: '(result set)', targetColumn: outCol,
                  condition: whereClause ? whereClause.trim() : null
                });
              });
              statementSummaries.push({kind:'SELECT', table:'(result set)', sourceTables:sourceTablesForStmt,
                detail:`SELECT ... FROM ${joinSource.trim()}`});
            }
          }
          // DECLARE / SET @var / IF / WHILE / PRINT / EXEC / TRY / CATCH / RETURN /
          // transaction control statements are intentionally left unhandled —
          // they don't move data between tables, so skipping them is safe.
        });

        procs[name] = {
          name, type:'PROCEDURE', params,
          tablesTouched: [...tablesTouched],
          transformations,
          statementSummaries
        };
      }catch(err){
        // one malformed procedure shouldn't prevent the rest of the file from parsing
        if(headerRe.lastIndex <= m.index) headerRe.lastIndex = m.index + m[0].length;
      }
    }
    return procs;
  }

  function computeGraph(tables){
    const edges = [];
    Object.values(tables).forEach(t=>{
      t.columns.forEach(c=>{
        if(c.isFK && c.references){
          edges.push({from:t.name, fromColumn:c.name, to:c.references.table, toColumn:c.references.column, type:'FK'});
        }
      });
    });
    return edges;
  }

  function computeUsage(tables, views, procs){
    // for each table/view: which views/procs depend on it, and via which columns
    const usage = {};
    Object.keys(tables).forEach(t=>usage[t] = {usedByViews:[], usedByProcs:[]});
    Object.keys(views).forEach(v=>usage[v] = {usedByViews:[], usedByProcs:[]});

    Object.values(views).forEach(v=>{
      v.baseTables.forEach(bt=>{
        if(!usage[bt]) usage[bt] = {usedByViews:[], usedByProcs:[]};
        usage[bt].usedByViews.push({
          view:v.name,
          columns:v.transformations.filter(c=>c.sourceTable===bt).map(c=>({from:c.sourceColumn,to:c.name,transform:c.transformation}))
        });
      });
    });
    Object.values(procs).forEach(p=>{
      p.tablesTouched.forEach(t=>{
        if(!usage[t]) usage[t] = {usedByViews:[], usedByProcs:[]};
        usage[t].usedByProcs.push({
          proc:p.name,
          columns:p.transformations.filter(tr=>tr.sourceTable===t || tr.targetTable===t)
            .map(tr=>({from:tr.sourceColumn,to:tr.targetColumn,transform:tr.transformation,direction: tr.targetTable===t?'IN':'OUT'}))
        });
      });
    });
    return usage;
  }

  function parseAll(rawSql){
    const sql = preprocess(rawSql);
    let tables = {}, views = {}, procs = {};
    try{ tables = parseTables(sql); }catch(err){ /* keep going with whatever else parses */ }
    try{ parseAlterForeignKeys(sql, tables); }catch(err){}
    try{ views = parseViews(sql); }catch(err){}
    try{ procs = parseProcedures(sql); }catch(err){}
    let edges = [], usage = {};
    try{ edges = computeGraph(tables); }catch(err){}
    try{ usage = computeUsage(tables, views, procs); }catch(err){}
    return {tables, views, procs, edges, usage};
  }

  return {parseAll};
})();

function getObject(name){
  if(SCHEMA.tables[name]) return {obj:SCHEMA.tables[name], type:'TABLE'};
  if(SCHEMA.views[name]) return {obj:SCHEMA.views[name], type:'VIEW'};
  if(SCHEMA.procs[name]) return {obj:SCHEMA.procs[name], type:'PROCEDURE'};
  return null;
}

/* =========================================================================
   4. HEADER / DROPDOWN / TABS
   ========================================================================= */
function buildDropdown(){
  const sel = document.getElementById('objectSelect');
  sel.innerHTML = '';
  const groups = [
    ['Tables', Object.keys(SCHEMA.tables)],
    ['Views', Object.keys(SCHEMA.views)],
    ['Stored Procedures', Object.keys(SCHEMA.procs)]
  ];
  groups.forEach(([label, names])=>{
    if(!names.length) return;
    const og = document.createElement('optgroup'); og.label = label;
    names.forEach(n=>{
      const o = document.createElement('option'); o.value = n; o.textContent = n;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value = State.selected;
  sel.onchange = ()=>{ selectObject(sel.value); };
}

function selectObject(name, opts={}){
  const found = getObject(name);
  if(!found) return;
  State.selected = name;
  State.selectedType = found.type;
  if(!opts.keepMode) State.diagramMode = 'detail';
  document.getElementById('objectSelect').value = name;
  const badge = document.getElementById('objectTypeBadge');
  badge.textContent = found.type;
  badge.className = 'type-badge ' + found.type;
  renderAll();
}

function showOverallDiagram(){
  switchToTab('diagramView');
  State.diagramMode = 'overview';
  renderDiagram();
}

/* =========================================================================
   LOAD SQL FROM FILE(S) — drag-and-drop or file picker, replaces the schema
   ========================================================================= */
let toastTimer = null;
function showToast(message, isError=false){
  const t = document.getElementById('statusToast');
  t.textContent = message;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), isError ? 5000 : 3200);
}

function loadSQLText(combinedSql, fileNames){
  let parsed;
  try{
    parsed = Parser.parseAll(combinedSql);
  }catch(err){
    showToast(`Failed to parse SQL: ${err.message}`, true);
    return;
  }
  const tableCount = Object.keys(parsed.tables).length;
  const viewCount = Object.keys(parsed.views).length;
  const procCount = Object.keys(parsed.procs).length;

  if(tableCount + viewCount + procCount === 0){
    showToast('No CREATE TABLE / VIEW / PROCEDURE statements were recognized in the uploaded file(s).', true);
    return;
  }

  SCHEMA = parsed;
  State.nodePositions = {};
  highlightedColumn = null;

  buildDropdown();

  const firstObject = Object.keys(SCHEMA.tables)[0] || Object.keys(SCHEMA.views)[0] || Object.keys(SCHEMA.procs)[0];
  State.diagramMode = 'overview';
  selectObject(firstObject, {keepMode:true});
  switchToTab('diagramView');

  showToast(`Loaded ${fileNames.length} file(s): ${tableCount} table(s), ${viewCount} view(s), ${procCount} procedure(s) parsed.`);
}

function handleFiles(fileList){
  const files = [...fileList].filter(f=> /\.(sql|txt)$/i.test(f.name));
  if(!files.length){
    showToast('No .sql or .txt files found in what was dropped/selected.', true);
    return;
  }
  Promise.all(files.map(f=> f.text())).then(contents=>{
    const combined = contents.map((text, i)=> `-- ==== ${files[i].name} ====\n${text}`).join('\n\n');
    loadSQLText(combined, files.map(f=>f.name));
  }).catch(err=> showToast(`Could not read file(s): ${err.message}`, true));
}

document.getElementById('btnOverallDiagram').addEventListener('click', showOverallDiagram);

document.getElementById('btnLoadSql').addEventListener('click', ()=> document.getElementById('sqlFileInput').click());
document.getElementById('sqlFileInput').addEventListener('change', (e)=>{
  if(e.target.files.length) handleFiles(e.target.files);
  e.target.value = '';
});

// window-wide drag & drop with an enter/leave counter to avoid overlay flicker on child elements
let dragCounter = 0;
const dropOverlay = document.getElementById('dropOverlay');
window.addEventListener('dragenter', (e)=>{
  if(!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('active');
});
window.addEventListener('dragover', (e)=>{
  if(!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
});
window.addEventListener('dragleave', (e)=>{
  dragCounter = Math.max(0, dragCounter-1);
  if(dragCounter===0) dropOverlay.classList.remove('active');
});
window.addEventListener('drop', (e)=>{
  if(!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  handleFiles(e.dataTransfer.files);
});

/* =========================================================================
   COLUMN SEARCH — search box in the header, autocomplete across all
   tables/views, selecting a result opens the column lineage diagram
   ========================================================================= */
function buildColumnIndex(){
  const idx = [];
  Object.values(SCHEMA.tables).forEach(t=> t.columns.forEach(c=> idx.push({table:t.name, type:'TABLE', column:c.name, dataType:c.type})));
  Object.values(SCHEMA.views).forEach(v=> v.columns.forEach(c=> idx.push({table:v.name, type:'VIEW', column:c.name, dataType:c.type})));
  return idx;
}

const columnSearchInput = document.getElementById('columnSearch');
const columnSearchResults = document.getElementById('columnSearchResults');

function renderSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q){ columnSearchResults.classList.remove('show'); columnSearchResults.innerHTML=''; return; }
  const matches = buildColumnIndex()
    .filter(e=> e.column.toLowerCase().includes(q) || e.table.toLowerCase().includes(q))
    .slice(0, 40);
  columnSearchResults.innerHTML = matches.length ? matches.map(m=>
    `<div class="search-result" data-table="${m.table}" data-column="${m.column}">
       <span class="sr-col">${m.column}</span>
       <span class="sr-table">${m.table} <span class="chip ${m.type}">${m.type}</span></span>
     </div>`
  ).join('') : `<div class="search-empty">No matching columns.</div>`;
  columnSearchResults.classList.add('show');
}

columnSearchInput.addEventListener('input', ()=> renderSearchResults(columnSearchInput.value));
columnSearchInput.addEventListener('focus', ()=>{ if(columnSearchInput.value.trim()) renderSearchResults(columnSearchInput.value); });
columnSearchResults.addEventListener('click', (e)=>{
  const row = e.target.closest('.search-result');
  if(!row) return;
  showColumnLineage(row.dataset.table, row.dataset.column);
  columnSearchResults.classList.remove('show');
  columnSearchInput.value = `${row.dataset.table}.${row.dataset.column}`;
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-group')) columnSearchResults.classList.remove('show');
});

function switchToTab(viewId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const tab = document.querySelector(`.tab[data-view="${viewId}"]`);
  if(tab) tab.classList.add('active');
  document.getElementById(viewId).classList.add('active');
  if(viewId === 'diagramView') requestAnimationFrame(applyTransform);
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=> switchToTab(tab.dataset.view));
});
