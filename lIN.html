const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svgCanvas');
let dragState = null;

// ---- theme palette used for SVG-drawn elements (CSS vars handle the rest of the UI) ----
const THEMES = {
  dark: {
    nodeFill:'#12151C', nodeHeader:'#171B24', nodeStroke:'#242938', nodeStrokeHi:'#3FE0C5',
    text:'#E7E9EE', textDim:'#565C6E', pk:'#F2B94D', pkBg:'#4A3A18', fk:'#6E9CFF', fkBg:'#1E2C4E',
    colText:'#D5D9E2', edge:'#3A4155', edgeHi:'#3FE0C5', highlightRow:'#132A26',
    typeColors:{TABLE:'#3FE0C5', VIEW:'#B79CFF', PROCEDURE:'#FFB25C'}
  },
  light: {
    nodeFill:'#FFFFFF', nodeHeader:'#F1F2F6', nodeStroke:'#D9DEE7', nodeStrokeHi:'#0D9488',
    text:'#181B22', textDim:'#8B92A3', pk:'#8A5A08', pkBg:'#FBE7C2', fk:'#2A57D6', fkBg:'#E1E8FF',
    colText:'#2A2F3A', edge:'#B7BECD', edgeHi:'#0D9488', highlightRow:'#DFF6F1',
    typeColors:{TABLE:'#0D9488', VIEW:'#7C4FE0', PROCEDURE:'#C2740A'}
  }
};
function theme(){ return THEMES[State.settings.theme] || THEMES.dark; }

function el(tag, attrs={}, children=[]){
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k, v));
  children.forEach(c=>e.appendChild(c));
  return e;
}

// current render's layout (name -> {x,y,width,height}) and edge definitions, kept live for dragging
let layout = {};
let edgeDefs = [];

function nodeDims(tableObj){
  const rowH = 24, headerH = 32, width = 240;
  return {width, height: headerH + tableObj.columns.length*rowH + 8};
}

function anchorPoints(a, b){
  const aCenterX = a.x + a.width/2, bCenterX = b.x + b.width/2;
  if(aCenterX <= bCenterX){
    return {x1:a.x+a.width, y1:a.y+Math.min(40,a.height/2), x2:b.x, y2:b.y+Math.min(40,b.height/2)};
  }
  return {x1:a.x, y1:a.y+Math.min(40,a.height/2), x2:b.x+b.width, y2:b.y+Math.min(40,b.height/2)};
}

function edgePath(x1,y1,x2,y2){
  const midX = (x1+x2)/2;
  return `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;
}

function buildNode(tableObj, opts={}){
  const t = theme();
  const {width, height} = nodeDims(tableObj);
  const pos = layout[tableObj.name];
  const g = el('g', {class:'er-node', 'data-node': tableObj.name, transform:`translate(${pos.x},${pos.y})`});

  const typeColor = t.typeColors[tableObj.type] || t.typeColors.TABLE;

  g.appendChild(el('rect', {
    x:0, y:0, width, height, rx:8,
    fill:t.nodeFill, stroke: opts.highlight ? t.nodeStrokeHi : t.nodeStroke,
    'stroke-width': opts.highlight ? 2 : 1
  }));
  // drag handle = header bar (click without dragging drills down into this object)
  const handle = el('g', {class:'node-drag-handle'});
  handle.appendChild(el('rect', {x:0,y:0,width,height:32,rx:8,fill:t.nodeHeader}));
  handle.appendChild(el('rect', {x:0,y:24,width,height:8,fill:t.nodeHeader}));
  handle.appendChild(el('rect', {x:0,y:0,width:4,height,fill:typeColor,rx:2}));
  const title = el('text', {x:16, y:21, fill:t.text, 'font-family':'IBM Plex Mono', 'font-size':13, 'font-weight':600});
  title.textContent = tableObj.name;
  handle.appendChild(title);
  const tlabel = el('text', {x:width-14, y:21, fill:typeColor, 'font-family':'IBM Plex Mono', 'font-size':9, 'text-anchor':'end'});
  tlabel.textContent = tableObj.type;
  handle.appendChild(tlabel);
  handle.addEventListener('mousedown', (e)=> startNodeDrag(tableObj.name, e, opts.onClick));
  g.appendChild(handle);

  tableObj.columns.forEach((c, i)=>{
    const cy = 32 + i*24;
    const rowG = el('g', {class:'er-col-row', 'data-col': c.name, style:'cursor:pointer'});
    if(opts.highlightCols && opts.highlightCols.includes(c.name)){
      rowG.appendChild(el('rect', {x:1, y:cy, width:width-2, height:24, fill:t.highlightRow}));
    }
    let badgeX = 16;
    if(c.isPK){
      rowG.appendChild(el('rect',{x:14,y:cy+5,width:22,height:14,rx:3,fill:t.pkBg}));
      const bt = el('text',{x:25,y:cy+15,fill:t.pk,'font-family':'IBM Plex Mono','font-size':9,'text-anchor':'middle','font-weight':700});
      bt.textContent='PK'; rowG.appendChild(bt);
      badgeX = 44;
    } else if(c.isFK){
      rowG.appendChild(el('rect',{x:14,y:cy+5,width:22,height:14,rx:3,fill:t.fkBg}));
      const bt = el('text',{x:25,y:cy+15,fill:t.fk,'font-family':'IBM Plex Mono','font-size':9,'text-anchor':'middle','font-weight':700});
      bt.textContent='FK'; rowG.appendChild(bt);
      badgeX = 44;
    }
    const nameText = el('text', {x:badgeX, y:cy+15, fill: c.isPK ? t.pk : (c.isFK ? t.fk : t.colText), 'font-family':'IBM Plex Mono', 'font-size':11.5});
    nameText.textContent = c.name + (c.notNull && State.settings.showNotNull ? ' *' : '');
    rowG.appendChild(nameText);

    if(State.settings.showDataTypes){
      const typeText = el('text', {x:width-14, y:cy+15, fill:t.textDim, 'font-family':'IBM Plex Mono', 'font-size':10, 'text-anchor':'end'});
      typeText.textContent = c.type || '';
      rowG.appendChild(typeText);
    }
    rowG.addEventListener('click', (e)=>{ e.stopPropagation(); highlightColumnLineage(tableObj.name, c.name); });
    rowG.addEventListener('mouseenter', (e)=> showTooltip(e, `<div class="tt-label">${tableObj.name}.${c.name}</div>${c.type||''} ${c.isPK?'· Primary Key':''} ${c.isFK?'· FK → '+c.references.table+'.'+c.references.column:''} ${c.notNull?'· NOT NULL':''}`));
    rowG.addEventListener('mousemove', moveTooltip);
    rowG.addEventListener('mouseleave', hideTooltip);
    g.appendChild(rowG);
  });

  return g;
}

// compact node used for stored procedures in the overview diagram
function buildCompactNode(procObj, opts={}){
  const t = theme();
  const pos = layout[procObj.name];
  const width = pos.width, height = pos.height;
  const g = el('g', {class:'er-node', 'data-node': procObj.name, transform:`translate(${pos.x},${pos.y})`});
  g.appendChild(el('rect', {x:0,y:0,width,height,rx:8, fill:t.nodeFill, stroke: opts.highlight?t.nodeStrokeHi:t.nodeStroke, 'stroke-width': opts.highlight?2:1, 'stroke-dasharray':'5,3'}));
  const handle = el('g', {class:'node-drag-handle'});
  handle.appendChild(el('rect', {x:0,y:0,width:4,height,fill:t.typeColors.PROCEDURE,rx:2}));
  const icon = el('text', {x:14, y:23, fill:t.typeColors.PROCEDURE, 'font-family':'IBM Plex Mono', 'font-size':11, 'font-weight':700});
  icon.textContent = '⚙';
  handle.appendChild(icon);
  const title = el('text', {x:30, y:22, fill:t.text, 'font-family':'IBM Plex Mono', 'font-size':11.5, 'font-weight':600});
  title.textContent = procObj.name.length>22 ? procObj.name.slice(0,21)+'…' : procObj.name;
  handle.appendChild(title);
  const sub = el('text', {x:14, y:40, fill:t.textDim, 'font-family':'IBM Plex Mono', 'font-size':9.5});
  sub.textContent = `${procObj.params.length} param · ${procObj.tablesTouched.length} table(s)`;
  handle.appendChild(sub);
  handle.addEventListener('mousedown', (e)=> startNodeDrag(procObj.name, e, opts.onClick));
  handle.addEventListener('mouseenter', (e)=> showTooltip(e, `<div class="tt-label">${procObj.name}</div>PROCEDURE · touches ${procObj.tablesTouched.join(', ')||'no tables'} — click to open`));
  handle.addEventListener('mousemove', moveTooltip);
  handle.addEventListener('mouseleave', hideTooltip);
  g.appendChild(handle);
  return g;
}

function drawEdge(def){
  const t = theme();
  const {x1,y1,x2,y2} = anchorPoints(layout[def.from], layout[def.to]);
  const path = edgePath(x1,y1,x2,y2);
  const g = el('g', {class:'er-edge'});
  const pAttrs = {d:path, fill:'none', stroke: def.highlight ? t.edgeHi : t.edge, 'stroke-width': def.highlight ? 2 : (def.thin ? 1 : 1.5), 'marker-end':'url(#arrow)'};
  if(def.dashed) pAttrs['stroke-dasharray'] = def.thin ? '3,4' : '6,4';
  if(def.thin) pAttrs['opacity'] = '0.55';
  const p = el('path', pAttrs);
  g.appendChild(p);
  def.pathEl = p;
  if(def.label){
    const hitbox = el('path', {d:path, fill:'none', stroke:'transparent', 'stroke-width':14, style:'cursor:pointer'});
    hitbox.addEventListener('mouseenter', (e)=>showTooltip(e, `<div class="tt-label">${def.dashed?'Lineage link':'Join / FK condition'}</div>${def.label}`));
    hitbox.addEventListener('mousemove', moveTooltip);
    hitbox.addEventListener('mouseleave', hideTooltip);
    g.appendChild(hitbox);
    def.hitEl = hitbox;
  }
  return g;
}

function redrawEdges(){
  edgeDefs.forEach(def=>{
    const {x1,y1,x2,y2} = anchorPoints(layout[def.from], layout[def.to]);
    const d = edgePath(x1,y1,x2,y2);
    if(def.pathEl) def.pathEl.setAttribute('d', d);
    if(def.hitEl) def.hitEl.setAttribute('d', d);
  });
}

function positionKey(){
  if(State.diagramMode === 'overview') return '__overview__';
  if(State.diagramMode === 'column') return '__column__';
  return State.selected;
}

function startNodeDrag(name, e, onClick){
  e.stopPropagation();
  e.preventDefault();
  const nodeG = svg.querySelector(`g.er-node[data-node="${CSS.escape(name)}"]`);
  if(nodeG) nodeG.classList.add('dragging');
  const startMouse = {x:e.clientX, y:e.clientY};
  const startPos = {x:layout[name].x, y:layout[name].y};
  let moved = false;
  function onMove(ev){
    if(Math.abs(ev.clientX-startMouse.x)>3 || Math.abs(ev.clientY-startMouse.y)>3) moved = true;
    const dx = (ev.clientX-startMouse.x)/State.zoom;
    const dy = (ev.clientY-startMouse.y)/State.zoom;
    layout[name].x = startPos.x + dx;
    layout[name].y = startPos.y + dy;
    if(nodeG) nodeG.setAttribute('transform', `translate(${layout[name].x},${layout[name].y})`);
    redrawEdges();
  }
  function onUp(){
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    if(nodeG) nodeG.classList.remove('dragging');
    if(moved){
      const key = positionKey();
      if(!State.nodePositions[key]) State.nodePositions[key] = {};
      State.nodePositions[key][name] = {x:layout[name].x, y:layout[name].y};
    } else if(onClick){
      onClick();
    }
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}


function ensureDefs(){
  svg.querySelectorAll('defs').forEach(d=>d.remove());
  const defs = el('defs');
  const t = theme();
  const marker = el('marker', {id:'arrow', viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});
  marker.appendChild(el('path', {d:'M0,0 L10,5 L0,10 z', fill:t.edge}));
  defs.appendChild(marker);
  svg.appendChild(defs);
}

let highlightedColumn = null;

function highlightColumnLineage(tableName, colName){
  highlightedColumn = {table:tableName, column:colName};
  renderDiagram();
}

function renderDiagram(){
  if(State.diagramMode === 'overview') renderOverviewDiagram();
  else if(State.diagramMode === 'column') renderColumnLineageDiagram();
  else renderDetailDiagram();
}

/* =========================================================================
   COLUMN-LEVEL LINEAGE ENGINE — traces a column forward (into views/procs
   that read it) and backward (into whatever feeds it) across the schema
   ========================================================================= */
function computeColumnLineage(startTable, startColumn){
  const nodeKey = (t,c)=> t+'\u0001'+c;
  const visitedNodes = new Set([nodeKey(startTable, startColumn)]);
  const involvedObjects = new Set([startTable]);
  const edges = [];
  const MAX_DEPTH = 6;

  function expandDownstream(table, column, depth){
    if(depth>MAX_DEPTH) return;
    Object.values(SCHEMA.views).forEach(v=>{
      v.transformations.forEach(tr=>{
        if(tr.sourceTable===table && tr.sourceColumn===column){
          edges.push({fromTable:table, fromColumn:column, toTable:v.name, toColumn:tr.name, via:v.name, transformation:tr.transformation});
          involvedObjects.add(v.name);
          const key = nodeKey(v.name, tr.name);
          if(!visitedNodes.has(key)){ visitedNodes.add(key); expandDownstream(v.name, tr.name, depth+1); }
        }
      });
    });
    Object.values(SCHEMA.procs).forEach(p=>{
      p.transformations.forEach(tr=>{
        if(tr.sourceTable===table && tr.sourceColumn===column){
          const toTable = tr.targetTable;
          edges.push({fromTable:table, fromColumn:column, toTable, toColumn:tr.targetColumn, via:p.name, transformation:tr.transformation});
          involvedObjects.add(p.name);
          if(toTable && toTable !== '(result set)'){
            involvedObjects.add(toTable);
            const key = nodeKey(toTable, tr.targetColumn);
            if(!visitedNodes.has(key)){ visitedNodes.add(key); expandDownstream(toTable, tr.targetColumn, depth+1); }
          }
        }
      });
    });
  }

  function expandUpstream(table, column, depth){
    if(depth>MAX_DEPTH) return;
    const viewObj = SCHEMA.views[table];
    if(viewObj){
      viewObj.transformations.forEach(tr=>{
        if(tr.name===column && tr.sourceTable){
          edges.push({fromTable:tr.sourceTable, fromColumn:tr.sourceColumn, toTable:table, toColumn:column, via:table, transformation:tr.transformation});
          involvedObjects.add(tr.sourceTable);
          const key = nodeKey(tr.sourceTable, tr.sourceColumn);
          if(!visitedNodes.has(key)){ visitedNodes.add(key); expandUpstream(tr.sourceTable, tr.sourceColumn, depth+1); }
        }
      });
    }
    Object.values(SCHEMA.procs).forEach(p=>{
      p.transformations.forEach(tr=>{
        if(tr.targetTable===table && tr.targetColumn===column && tr.sourceTable){
          edges.push({fromTable:tr.sourceTable, fromColumn:tr.sourceColumn, toTable:table, toColumn:column, via:p.name, transformation:tr.transformation});
          involvedObjects.add(p.name);
          involvedObjects.add(tr.sourceTable);
          const key = nodeKey(tr.sourceTable, tr.sourceColumn);
          if(!visitedNodes.has(key)){ visitedNodes.add(key); expandUpstream(tr.sourceTable, tr.sourceColumn, depth+1); }
        }
      });
    });
  }

  expandDownstream(startTable, startColumn, 0);
  expandUpstream(startTable, startColumn, 0);

  // literal-value writes / result-set-only reads on the *start* column have
  // no resolvable source/target table, so the BFS above can't reach them —
  // surface them directly so they still show up as involved objects
  Object.values(SCHEMA.procs).forEach(p=>{
    p.transformations.forEach(tr=>{
      const writesHereLiteral = tr.targetTable===startTable && tr.targetColumn===startColumn && !tr.sourceTable;
      const readsIntoResultSet = tr.sourceTable===startTable && tr.sourceColumn===startColumn && tr.targetTable==='(result set)';
      if(writesHereLiteral || readsIntoResultSet){
        involvedObjects.add(p.name);
        edges.push({
          fromTable: writesHereLiteral ? p.name : startTable,
          fromColumn: writesHereLiteral ? '(literal)' : startColumn,
          toTable: writesHereLiteral ? startTable : p.name,
          toColumn: writesHereLiteral ? startColumn : '(result set)',
          via: p.name, transformation: tr.transformation, direct:true
        });
      }
    });
  });

  // de-duplicate identical edges (can recur via different traversal paths)
  const seen = new Set();
  const dedupedEdges = edges.filter(e=>{
    const k = [e.fromTable,e.fromColumn,e.toTable,e.toColumn,e.via].join('|');
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });

  return {edges: dedupedEdges, involvedObjects: [...involvedObjects].filter(n=>getObject(n))};
}

function showColumnLineage(table, column){
  switchToTab('diagramView');
  State.diagramMode = 'column';
  State.columnFocus = {table, column};
  renderDiagram();
}

function renderColumnLineageDiagram(){
  ensureDefs();
  [...svg.querySelectorAll('g')].forEach(g=>g.remove());
  const contentG = el('g', {id:'contentG'});
  svg.appendChild(contentG);
  const edgesG = el('g', {id:'edgesG'});
  const nodesG = el('g', {id:'nodesG'});
  contentG.appendChild(edgesG);
  contentG.appendChild(nodesG);

  const {table, column} = State.columnFocus || {};
  if(!table || !getObject(table)){ applyTransform(); return; }
  const {edges, involvedObjects} = computeColumnLineage(table, column);

  const saved = State.nodePositions['__column__'] || {};
  layout = {};
  const cols = Math.max(1, Math.min(3, involvedObjects.length));
  const colWidth = 300, startX = 60, startY = 60;
  const colHeights = new Array(cols).fill(startY);
  involvedObjects.forEach((name, i)=>{
    const found = getObject(name);
    const dims = found.type==='PROCEDURE' ? {width:220, height:56} : nodeDims(found.obj);
    const col = i % cols;
    const p = saved[name];
    const x = p ? p.x : startX + col*colWidth;
    const y = p ? p.y : colHeights[col];
    layout[name] = {x, y, width:dims.width, height:dims.height};
    if(!p) colHeights[col] = y + dims.height + 40;
  });

  edgeDefs = edges.filter(e=>layout[e.fromTable] && layout[e.toTable]).map(e=>({
    from:e.fromTable, to:e.toTable,
    label: e.direct
      ? `${e.via}: ${e.transformation}${e.fromColumn==='(literal)' ? ' (literal value written)' : ' (read into result set, no downstream column)'}`
      : `${e.fromTable}.${e.fromColumn} —(${e.transformation} via ${e.via})→ ${e.toTable}.${e.toColumn}`,
    highlight: !e.direct,
    dashed: !!e.direct
  }));
  edgeDefs.forEach(def=> edgesG.appendChild(drawEdge(def)));

  involvedObjects.forEach(name=>{
    const found = getObject(name);
    if(!found || !layout[name]) return;
    const isFocus = name===table;
    if(found.type==='PROCEDURE'){
      nodesG.appendChild(buildCompactNode(found.obj, {highlight:isFocus, onClick:()=>drillInto(name)}));
    } else {
      const relevantCols = new Set([
        ...(name===table ? [column] : []),
        ...edges.filter(e=>e.toTable===name).map(e=>e.toColumn),
        ...edges.filter(e=>e.fromTable===name).map(e=>e.fromColumn)
      ]);
      nodesG.appendChild(buildNode(found.obj, {highlight:isFocus, highlightCols:[...relevantCols], onClick:()=>drillInto(name)}));
    }
  });

  applyTransform();
  renderColumnSidebar(table, column, edges);
}

function renderColumnSidebar(table, column, edges){
  const sb = document.getElementById('sidebar');
  const lineageEdges = edges.filter(e=>!e.direct);
  const directEdges = edges.filter(e=>e.direct);

  let html = `<h2>${table}.${column}</h2><div class="subhead">Column Lineage</div>`;
  html += `<div class="side-section"><h3>Lineage Steps (${lineageEdges.length})</h3>`;
  if(!lineageEdges.length){
    html += `<div class="empty-note">No traceable upstream/downstream column-to-column lineage found${directEdges.length?' — see direct references below.':'.'}</div>`;
  } else {
    lineageEdges.forEach(e=>{
      html += `<div class="dep-card"><div class="dep-cols">
        <code>${e.fromTable}.${e.fromColumn}</code><br>
        <span class="op-badge">${e.transformation}</span> via <b>${e.via}</b><br>
        → <code>${e.toTable}.${e.toColumn}</code>
      </div></div>`;
    });
  }
  html += `</div>`;

  if(directEdges.length){
    html += `<div class="side-section"><h3>Direct References</h3>`;
    directEdges.forEach(e=>{
      const isWrite = e.fromColumn === '(literal)';
      html += `<div class="dep-card"><div class="dep-cols"><b>${e.via}</b> ${isWrite?'writes a literal value':'reads into its result set'} <span class="op-badge">${e.transformation}</span></div></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="side-section"><h3>Objects Involved</h3>`;
  const objs = new Set([table]);
  edges.forEach(e=>{ objs.add(e.fromTable); objs.add(e.toTable); objs.add(e.via); });
  html += [...objs].filter(o=>getObject(o)).map(o=>{
    const t = getObject(o).type;
    return `<div class="dep-card" style="cursor:pointer" data-drill="${o}">${o} <span class="chip ${t}">${t}</span></div>`;
  }).join('');
  html += `</div>`;
  sb.innerHTML = html;
  sb.querySelectorAll('[data-drill]').forEach(elx=> elx.addEventListener('click', ()=> drillInto(elx.dataset.drill)));
}

function computeOverviewLayout(tableViewNames, procNames){
  const saved = State.nodePositions['__overview__'] || {};
  const layout = {};
  const cols = Math.max(1, Math.min(4, Math.ceil(Math.sqrt(tableViewNames.length || 1))));
  const colWidth = 280, startX = 40, startY = 40;
  const colHeights = new Array(cols).fill(startY);
  tableViewNames.forEach((name, i)=>{
    const obj = getObject(name).obj;
    const dims = nodeDims(obj);
    const col = i % cols;
    const p = saved[name];
    const x = p ? p.x : startX + col*colWidth;
    const y = p ? p.y : colHeights[col];
    layout[name] = {x, y, width:dims.width, height:dims.height};
    if(!p) colHeights[col] = y + dims.height + 40;
  });
  const maxTableY = Math.max(startY, ...colHeights);
  const procCols = Math.max(1, Math.min(5, Math.ceil(Math.sqrt(procNames.length || 1))));
  const procColWidth = 250;
  const procColHeights = new Array(procCols).fill(maxTableY + 50);
  procNames.forEach((name, i)=>{
    const proc = SCHEMA.procs[name];
    const col = i % procCols;
    const p = saved[name];
    const width = 220, height = 56;
    const x = p ? p.x : startX + col*procColWidth;
    const y = p ? p.y : procColHeights[col];
    layout[name] = {x, y, width, height};
    if(!p) procColHeights[col] = y + height + 24;
  });
  return layout;
}

function drillInto(name){
  State.diagramMode = 'detail';
  selectObject(name);
}

function renderOverviewDiagram(){
  ensureDefs();
  [...svg.querySelectorAll('g')].forEach(g=>g.remove());
  const contentG = el('g', {id:'contentG'});
  svg.appendChild(contentG);
  const edgesG = el('g', {id:'edgesG'});
  const nodesG = el('g', {id:'nodesG'});
  contentG.appendChild(edgesG);
  contentG.appendChild(nodesG);

  const tableViewNames = [...Object.keys(SCHEMA.tables), ...Object.keys(SCHEMA.views)];
  const procNames = Object.keys(SCHEMA.procs);
  layout = computeOverviewLayout(tableViewNames, procNames);

  edgeDefs = [];
  SCHEMA.edges.forEach(e=>{
    if(layout[e.from] && layout[e.to]){
      edgeDefs.push({from:e.from, to:e.to, label:`${e.from}.${e.fromColumn} → ${e.to}.${e.toColumn}`});
    }
  });
  Object.values(SCHEMA.views).forEach(v=>{
    v.baseTables.forEach(bt=>{
      if(layout[bt] && layout[v.name] && bt!==v.name){
        edgeDefs.push({from:v.name, to:bt, label:`${v.name} derives from ${bt}`, dashed:true});
      }
    });
  });
  Object.values(SCHEMA.procs).forEach(p=>{
    p.tablesTouched.forEach(t=>{
      if(layout[t] && layout[p.name]){
        edgeDefs.push({from:p.name, to:t, label:`${p.name} touches ${t}`, dashed:true, thin:true});
      }
    });
  });

  edgeDefs.forEach(def=> edgesG.appendChild(drawEdge(def)));
  tableViewNames.forEach(name=>{
    const obj = getObject(name).obj;
    nodesG.appendChild(buildNode(obj, {onClick:()=>drillInto(name)}));
  });
  procNames.forEach(name=>{
    nodesG.appendChild(buildCompactNode(SCHEMA.procs[name], {onClick:()=>drillInto(name)}));
  });

  applyTransform();
  renderSidebar();
}

function renderDetailDiagram(){
  ensureDefs();
  [...svg.querySelectorAll('g')].forEach(g=>g.remove());
  const contentG = el('g', {id:'contentG'});
  svg.appendChild(contentG);
  const edgesG = el('g', {id:'edgesG'});
  const nodesG = el('g', {id:'nodesG'});
  contentG.appendChild(edgesG);
  contentG.appendChild(nodesG);

  const found = getObject(State.selected);
  if(!found) return;
  const {obj, type} = found;

  let centerObj, related = [];

  if(type === 'TABLE' || type === 'VIEW'){
    centerObj = obj;
    const fkTargets = obj.columns.filter(c=>c.isFK).map(c=>c.references.table);
    const fkSources = Object.values(SCHEMA.tables).filter(t=>t.columns.some(c=>c.isFK && c.references.table===obj.name)).map(t=>t.name);
    const viewDeps = (SCHEMA.usage[obj.name]?.usedByViews || []).map(v=>v.view);
    related = [...new Set([...fkTargets, ...fkSources, ...viewDeps])].filter(n=>n!==obj.name);
  } else {
    related = obj.tablesTouched;
    centerObj = null;
  }

  // ---- compute default layout, then apply any saved (dragged) overrides ----
  layout = {};
  const saved = State.nodePositions[positionKey()] || {};
  if(centerObj){
    const dims = nodeDims(centerObj);
    const p = saved[centerObj.name];
    layout[centerObj.name] = {x: p?p.x:60, y: p?p.y:260, width:dims.width, height:dims.height};
  }
  const relX = centerObj ? 60 + 340 : 60;
  let relY = 40;
  related.forEach(rname=>{
    const relObj = getObject(rname);
    if(!relObj) return;
    const dims = nodeDims(relObj.obj);
    const p = saved[rname];
    layout[rname] = {x: p?p.x:relX, y: p?p.y:relY, width:dims.width, height:dims.height};
    relY += dims.height + 36;
  });

  // ---- build edge definitions ----
  edgeDefs = [];
  if(centerObj && (type==='TABLE'||type==='VIEW')){
    centerObj.columns.filter(c=>c.isFK).forEach(c=>{
      if(!layout[c.references.table]) return;
      edgeDefs.push({from:centerObj.name, to:c.references.table,
        label:`${centerObj.name}.${c.name} → ${c.references.table}.${c.references.column}`,
        highlight: highlightedColumn && (highlightedColumn.table===centerObj.name||highlightedColumn.table===c.references.table)});
    });
    Object.values(SCHEMA.tables).forEach(t=>{
      t.columns.forEach(c=>{
        if(c.isFK && c.references.table===centerObj.name && layout[t.name]){
          edgeDefs.push({from:t.name, to:centerObj.name, label:`${t.name}.${c.name} → ${centerObj.name}.${c.references.column}`});
        }
      });
    });
    if(type==='VIEW'){
      obj.joins.forEach(j=>{
        if(layout[j.table]) edgeDefs.push({from:centerObj.name, to:j.table, label:`JOIN ON ${j.on}`});
      });
    }
  } else if(type==='PROCEDURE'){
    let prev = null;
    related.forEach(rname=>{
      if(!layout[rname]) return;
      if(prev) edgeDefs.push({from:prev, to:rname, label:`via ${obj.name}`, highlight:true});
      prev = rname;
    });
  }

  edgeDefs.forEach(def=> edgesG.appendChild(drawEdge(def)));

  if(centerObj) nodesG.appendChild(buildNode(centerObj, {highlight:true}));
  related.forEach(rname=>{
    const relObj = getObject(rname);
    if(!relObj || !layout[rname]) return;
    const highlightCols = [];
    if(type==='PROCEDURE'){
      obj.transformations.forEach(tr=>{
        if(tr.sourceTable===rname) highlightCols.push(tr.sourceColumn);
        if(tr.targetTable===rname) highlightCols.push(tr.targetColumn);
      });
    }
    nodesG.appendChild(buildNode(relObj.obj, {highlightCols, onClick:()=>drillInto(rname)}));
  });

  applyTransform();
  renderSidebar();
}

function applyTransform(){
  const contentG = svg.querySelector('#contentG');
  if(!contentG) return;
  contentG.setAttribute('transform', `translate(${State.pan.x},${State.pan.y}) scale(${State.zoom})`);
  const wrap = document.getElementById('diagramCanvasWrap');
  svg.setAttribute('width', wrap.clientWidth);
  svg.setAttribute('height', wrap.clientHeight);
}

function resizeCanvas(){
  const wrap = document.getElementById('diagramCanvasWrap');
  svg.setAttribute('width', wrap.clientWidth);
  svg.setAttribute('height', wrap.clientHeight);
}
window.addEventListener('resize', resizeCanvas);

// pan & zoom
const wrapEl = document.getElementById('diagramCanvasWrap');
wrapEl.addEventListener('mousedown', (e)=>{
  if(e.target.closest('.er-node')) return;
  dragState = {startX:e.clientX, startY:e.clientY, panX:State.pan.x, panY:State.pan.y};
  wrapEl.classList.add('grabbing');
});
window.addEventListener('mousemove', (e)=>{
  if(!dragState) return;
  State.pan.x = dragState.panX + (e.clientX - dragState.startX);
  State.pan.y = dragState.panY + (e.clientY - dragState.startY);
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ dragState=null; wrapEl.classList.remove('grabbing'); });
wrapEl.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  State.zoom = Math.min(2.5, Math.max(0.3, State.zoom + delta));
  applyTransform();
}, {passive:false});
document.getElementById('zoomIn').addEventListener('click', ()=>{ State.zoom=Math.min(2.5,State.zoom+0.15); applyTransform(); });
document.getElementById('zoomOut').addEventListener('click', ()=>{ State.zoom=Math.max(0.3,State.zoom-0.15); applyTransform(); });
document.getElementById('zoomReset').addEventListener('click', ()=>{ State.zoom=1; State.pan={x:0,y:0}; applyTransform(); });
document.getElementById('layoutReset').addEventListener('click', ()=>{ delete State.nodePositions[positionKey()]; renderDiagram(); });

// tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, html){ tooltip.innerHTML = html; tooltip.style.display='block'; moveTooltip(e); }
function moveTooltip(e){ tooltip.style.left=(e.clientX+14)+'px'; tooltip.style.top=(e.clientY+14)+'px'; }
function hideTooltip(){ tooltip.style.display='none'; }

/* =========================================================================
   6. SIDEBAR (contextual: dependencies / usage / upstream-downstream)
   ========================================================================= */
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  const found = getObject(State.selected);
  if(!found){ sb.innerHTML=''; return; }
  const {obj, type} = found;
  let html = `<h2>${obj.name}</h2><div class="subhead">${type}</div>`;

  if(type === 'PROCEDURE'){
    html += `<div class="side-section"><h3>Parameters</h3>`;
    if(obj.params.length){
      obj.params.forEach(p=>{
        html += `<div class="dep-card"><div class="dep-title">@${p.name} <span class="chip TABLE">${p.type}</span></div></div>`;
      });
    } else html += `<div class="empty-note">No parameters detected.</div>`;
    html += `</div>`;

    html += `<div class="side-section"><h3>Tables Touched (Upstream / Downstream)</h3>`;
    if(obj.tablesTouched.length){
      obj.tablesTouched.forEach(t=>{
        const cols = obj.transformations.filter(tr=>tr.sourceTable===t || tr.targetTable===t);
        html += `<div class="dep-card"><div class="dep-title">${t}</div><div class="dep-cols">`;
        cols.forEach(c=>{
          html += `${c.sourceTable===t? '<code>'+c.sourceColumn+'</code> (read)' : '<code>'+c.targetColumn+'</code> (written)'}<br>`;
        });
        html += `</div></div>`;
      });
    } else html += `<div class="empty-note">No tables detected.</div>`;
    html += `</div>`;
  }

  if(type === 'TABLE' || type === 'VIEW'){
    const usage = SCHEMA.usage[obj.name] || {usedByViews:[], usedByProcs:[]};
    html += `<div class="side-section"><h3>Dependencies · used by</h3>`;
    if(!usage.usedByViews.length && !usage.usedByProcs.length){
      html += `<div class="empty-note">Not referenced by any parsed View or Stored Procedure.</div>`;
    }
    usage.usedByViews.forEach(v=>{
      html += `<div class="dep-card"><div class="dep-title">${v.view} <span class="chip VIEW">VIEW</span></div><div class="dep-cols">`;
      v.columns.forEach(c=> html += `<code>${c.from}</code> → <code>${c.to}</code> <span class="op-badge">${c.transform}</span><br>`);
      html += `</div></div>`;
    });
    usage.usedByProcs.forEach(p=>{
      html += `<div class="dep-card"><div class="dep-title">${p.proc} <span class="chip PROCEDURE">SP</span></div><div class="dep-cols">`;
      p.columns.forEach(c=> html += `<code>${c.from||'—'}</code> → <code>${c.to||'—'}</code> <span class="op-badge">${c.transform}</span> <span style="color:var(--text-faint)">(${c.direction})</span><br>`);
      html += `</div></div>`;
    });
    html += `</div>`;

    if(type==='TABLE'){
      const parents = obj.columns.filter(c=>c.isFK).map(c=>c.references.table);
      const children = Object.values(SCHEMA.tables).filter(t=>t.columns.some(c=>c.isFK && c.references.table===obj.name)).map(t=>t.name);
      html += `<div class="side-section"><h3>Upstream (parent tables)</h3>`;
      html += parents.length ? parents.map(p=>`<div class="dep-card">${p}</div>`).join('') : `<div class="empty-note">No parent tables (root entity).</div>`;
      html += `</div><div class="side-section"><h3>Downstream (child tables)</h3>`;
      html += children.length ? children.map(c=>`<div class="dep-card">${c}</div>`).join('') : `<div class="empty-note">No dependent child tables.</div>`;
      html += `</div>`;
    } else {
      html += `<div class="side-section"><h3>Upstream (base tables)</h3>`;
      html += obj.baseTables.map(b=>`<div class="dep-card">${b}</div>`).join('') || `<div class="empty-note">None detected.</div>`;
      html += `</div>`;
    }
  }

  sb.innerHTML = html;
}

/* =========================================================================
   7. LINEAGE FLOW TAB
   ========================================================================= */
function renderLineageFlow(){
  const view = document.getElementById('lineageView');
  const found = getObject(State.selected);
  if(!found){ view.innerHTML=''; return; }
  const {obj, type} = found;
  let html = '';

  if(type === 'PROCEDURE'){
    html += `<div class="flow-header"><h2>${obj.name}</h2>
      <p>Sequential data flow across ${obj.statementSummaries.length} statement(s), touching ${obj.tablesTouched.length} table(s): ${obj.tablesTouched.join(', ')}.</p></div>`;

    obj.statementSummaries.forEach((s, i)=>{
      html += `<div class="section-block">
        <h3><span class="stmt-badge ${s.kind}">${s.kind}</span>&nbsp; Step ${i+1} — ${s.table}</h3>
        <div class="flow-chain">
          ${(s.sourceTables||[]).map(st=>`<div class="flow-node"><div class="t">source</div><div class="n">${st}</div></div><div class="flow-arrow">→</div>`).join('')}
          <div class="flow-node"><div class="t">target</div><div class="n">${s.table}</div></div>
        </div>
        <div style="color:var(--text-dim);font-family:var(--mono);font-size:12px;">${s.detail}</div>
      </div>`;
    });

    html += `<div class="section-block"><h3>Column-Level Transformation Log</h3>
      <table class="transform-table"><thead><tr><th>Source</th><th>Transformation</th><th>Target</th><th>Condition</th></tr></thead><tbody>`;
    obj.transformations.forEach(t=>{
      html += `<tr>
        <td class="src-col">${t.sourceTable ? t.sourceTable+'.' : ''}${t.sourceColumn||'—'}</td>
        <td><span class="op-badge">${t.transformation}</span></td>
        <td class="tgt-col">${t.targetTable}.${t.targetColumn}</td>
        <td style="color:var(--text-faint)">${t.condition||'—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if(type === 'VIEW'){
    html += `<div class="flow-header"><h2>${obj.name}</h2>
      <p>Derived from ${obj.baseTables.join(', ')} via ${obj.joins.length} join(s). ${obj.transformations.length} output column(s).</p></div>`;
    html += `<div class="flow-chain">`;
    obj.baseTables.forEach(bt=>{
      html += `<div class="flow-node"><div class="t">base table</div><div class="n">${bt}</div></div><div class="flow-arrow">→</div>`;
    });
    html += `<div class="flow-node"><div class="t">view</div><div class="n">${obj.name}</div></div></div>`;
    html += `<div class="section-block"><h3>Column Derivation</h3>
      <table class="transform-table"><thead><tr><th>Source</th><th>Transformation</th><th>Output Column</th></tr></thead><tbody>`;
    obj.transformations.forEach(t=>{
      html += `<tr><td class="src-col">${t.sourceTable||'—'}.${t.sourceColumn||'—'}</td><td><span class="op-badge">${t.transformation}</span></td><td class="tgt-col">${t.name}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    if(obj.joins.length){
      html += `<div class="section-block"><h3>Join Conditions</h3>`;
      obj.joins.forEach(j=> html += `<div class="dep-cols" style="font-family:var(--mono);font-size:12.5px;color:var(--text-dim);margin-bottom:6px;">JOIN <span class="tgt-col">${j.table}</span> ON <code style="color:var(--accent)">${j.on}</code></div>`);
      html += `</div>`;
    }
  }

  if(type === 'TABLE'){
    const parents = obj.columns.filter(c=>c.isFK).map(c=>c.references.table);
    const children = Object.values(SCHEMA.tables).filter(t=>t.columns.some(c=>c.isFK && c.references.table===obj.name)).map(t=>t.name);
    const usage = SCHEMA.usage[obj.name] || {usedByViews:[], usedByProcs:[]};
    html += `<div class="flow-header"><h2>${obj.name}</h2><p>Full lineage chain: upstream parents, this table, downstream children and consumers.</p></div>`;
    html += `<div class="flow-chain">`;
    parents.forEach(p=> html += `<div class="flow-node"><div class="t">upstream</div><div class="n">${p}</div></div><div class="flow-arrow">→</div>`);
    html += `<div class="flow-node" style="border-color:var(--accent)"><div class="t">this table</div><div class="n">${obj.name}</div></div>`;
    children.forEach(c=> html += `<div class="flow-arrow">→</div><div class="flow-node"><div class="t">downstream</div><div class="n">${c}</div></div>`);
    [...usage.usedByViews.map(v=>v.view), ...usage.usedByProcs.map(p=>p.proc)].forEach(name=>{
      html += `<div class="flow-arrow">→</div><div class="flow-node"><div class="t">consumer</div><div class="n">${name}</div></div>`;
    });
    html += `</div>`;
    if(!parents.length && !children.length && !usage.usedByViews.length && !usage.usedByProcs.length){
      html += `<div class="empty-note">No lineage relationships detected for this table.</div>`;
    }
  }

  view.innerHTML = html;
}

function syntaxHighlight(json){
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g,
    (match)=>{
      let cls = 'jnum';
      if(/^"/.test(match)){ cls = /:$/.test(match) ? 'jk' : 'jstr'; }
      else if(/true|false/.test(match)) cls='jbool';
      return `<span class="${cls}">${match}</span>`;
    });
}
function renderJson(){
  const found = getObject(State.selected);
  const payload = {
    selected: State.selected,
    type: State.selectedType,
    GraphNodes: {tables: SCHEMA.tables, views: SCHEMA.views},
    Edges: SCHEMA.edges,
    LineageData: {procedures: SCHEMA.procs, usage: SCHEMA.usage},
    currentObject: found ? found.obj : null
  };
  const str = JSON.stringify(payload, null, 2);
  document.getElementById('jsonOutput').innerHTML = syntaxHighlight(str.replace(/</g,'&lt;'));
  document.getElementById('btnCopyJson').onclick = ()=>{
    navigator.clipboard.writeText(str);
    const btn = document.getElementById('btnCopyJson');
    const old = btn.textContent; btn.textContent='Copied ✓';
    setTimeout(()=>btn.textContent=old, 1200);
  };
}

/* =========================================================================
   10. HD EXPORT
   ========================================================================= */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const scale = State.settings.exportScale || 3;
  const bbox = svg.querySelector('#contentG').getBBox();
  const pad = 40;
  const w = bbox.width + pad*2, h = bbox.height + pad*2;

  const clone = svg.cloneNode(true);
  clone.setAttribute('width', w); clone.setAttribute('height', h);
  clone.setAttribute('viewBox', `${bbox.x-pad} ${bbox.y-pad} ${w} ${h}`);
  clone.querySelector('#contentG').removeAttribute('transform');

  // inline background
  const bgColor = State.settings.theme === 'light' ? '#F3F4F7' : '#0B0D12';
  const bgRect = el('rect', {x:bbox.x-pad, y:bbox.y-pad, width:w, height:h, fill:bgColor});
  clone.insertBefore(bgRect, clone.firstChild);

  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = bgColor; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob)=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${State.selected}-lineage-diagram.png`;
      a.click();
    }, 'image/png', 1.0);
  };
  img.src = url;
});

/* =========================================================================
   10b. EXCEL EXPORT — Tables, Relationships, Views, Procedure Lineage, Usage
   ========================================================================= */
function sheetSafe(rows, placeholderCols){
  return rows.length ? rows : [placeholderCols.reduce((o,k)=>{ o[k]=''; return o; }, {})];
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    alert('Excel export library failed to load (no network access to cdnjs.cloudflare.com?). Please check your connection and try again.');
    return;
  }
  const wb = XLSX.utils.book_new();

  // --- Tables & Columns ---
  const tableRows = [];
  Object.values(SCHEMA.tables).forEach(t=>{
    t.columns.forEach(c=>{
      tableRows.push({
        Table: t.name, Column: c.name, DataType: c.type,
        PrimaryKey: c.isPK ? 'Yes' : '', ForeignKey: c.isFK ? 'Yes' : '',
        ReferencesTable: c.references ? c.references.table : '',
        ReferencesColumn: c.references ? c.references.column : '',
        NotNull: c.notNull ? 'Yes' : '', Unique: c.unique ? 'Yes' : ''
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(tableRows,
    ['Table','Column','DataType','PrimaryKey','ForeignKey','ReferencesTable','ReferencesColumn','NotNull','Unique'])), 'Tables');

  // --- Relationships (FK edges) ---
  const edgeRows = SCHEMA.edges.map(e=>({
    FromTable: e.from, FromColumn: e.fromColumn, ToTable: e.to, ToColumn: e.toColumn, RelationshipType: e.type
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(edgeRows,
    ['FromTable','FromColumn','ToTable','ToColumn','RelationshipType'])), 'Relationships');

  // --- Views & column derivation ---
  const viewRows = [];
  Object.values(SCHEMA.views).forEach(v=>{
    v.transformations.forEach(t=>{
      viewRows.push({
        View: v.name, BaseTables: v.baseTables.join(', '),
        SourceTable: t.sourceTable || '', SourceColumn: t.sourceColumn || '',
        Transformation: t.transformation, OutputColumn: t.name
      });
    });
    v.joins.forEach(j=>{
      viewRows.push({ View: v.name, BaseTables: v.baseTables.join(', '), SourceTable: j.table, SourceColumn: '(JOIN)', Transformation: `ON ${j.on}`, OutputColumn: '' });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(viewRows,
    ['View','BaseTables','SourceTable','SourceColumn','Transformation','OutputColumn'])), 'Views');

  // --- Stored procedure lineage / transformations ---
  const procRows = [];
  Object.values(SCHEMA.procs).forEach(p=>{
    p.transformations.forEach(t=>{
      procRows.push({
        Procedure: p.name, Statement: t.type,
        SourceTable: t.sourceTable || '', SourceColumn: t.sourceColumn || '',
        Transformation: t.transformation,
        TargetTable: t.targetTable, TargetColumn: t.targetColumn,
        Condition: t.condition || ''
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(procRows,
    ['Procedure','Statement','SourceTable','SourceColumn','Transformation','TargetTable','TargetColumn','Condition'])), 'Procedure Lineage');

  // --- Usage / dependency matrix (who consumes each table or view) ---
  const usageRows = [];
  Object.entries(SCHEMA.usage).forEach(([name, u])=>{
    u.usedByViews.forEach(v=> v.columns.forEach(c=>{
      usageRows.push({ Object: name, UsedBy: v.view, UsedByType: 'VIEW', SourceColumn: c.from, TargetColumn: c.to, Transformation: c.transform, Direction: '' });
    }));
    u.usedByProcs.forEach(p=> p.columns.forEach(c=>{
      usageRows.push({ Object: name, UsedBy: p.proc, UsedByType: 'PROCEDURE', SourceColumn: c.from||'', TargetColumn: c.to||'', Transformation: c.transform, Direction: c.direction });
    }));
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(usageRows,
    ['Object','UsedBy','UsedByType','SourceColumn','TargetColumn','Transformation','Direction'])), 'Usage & Dependencies');

  // --- Stored procedure parameters ---
  const paramRows = [];
  Object.values(SCHEMA.procs).forEach(p=>{
    p.params.forEach(param=> paramRows.push({ Procedure: p.name, Parameter: '@'+param.name, DataType: param.type }));
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetSafe(paramRows,
    ['Procedure','Parameter','DataType'])), 'Procedure Parameters');

  XLSX.writeFile(wb, 'data-lineage-export.xlsx');
}
